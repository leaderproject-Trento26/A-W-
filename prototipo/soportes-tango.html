<title>Soportes Tango · Trento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --red:#D71F2B; --red-deep:#A3131D; --red-tint:#FBE9EA; --red-line:#F2C6C9;
  --ink:#231A1B; --muted:#6F6263; --line:#E7DEDE; --ground:#F4EFEF; --surface:#FFFFFF; --sunk:#FAF7F7;
  --ok:#1D8A56; --ok-tint:#E4F4EC; --warn:#B86F00; --warn-tint:#FCF1DC; --info:#2B5DA8; --info-tint:#E6EEF9;
  --gray:#7D7274; --gray-tint:#EEE8E8; --wa:#1F8F5A; --wa-tint:#E3F4EA;
  --on-red:#FFFFFF; --overlay:rgba(35,26,27,.45);
  --shadow:0 18px 40px -20px rgba(90,20,25,.35);
  --font:"Open Sans", Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
    --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
    --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
    --gray:#A89C9D; --gray-tint:#2C2425; --wa:#4CC08A; --wa-tint:#15301F; --overlay:rgba(0,0,0,.6);
    --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
  --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
  --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
  --gray:#A89C9D; --gray-tint:#2C2425; --wa:#4CC08A; --wa-tint:#15301F; --overlay:rgba(0,0,0,.6);
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}

.band{background:var(--red);color:var(--on-red);padding-inline:16px}
.band-in{max-width:1080px;margin:0 auto;padding-block:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-chip{background:#fff;border-radius:6px;padding:5px 9px;display:flex;align-items:center}
.logo-chip img{height:26px;display:block}
.band h1{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:160px}
.band-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;line-height:1.1}
.btn:hover:not(:disabled){border-color:var(--red-line)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover:not(:disabled){background:var(--red-deep);border-color:var(--red-deep)}
.btn.inv{background:#fff;border-color:#fff;color:#A3131D}
.btn.ghost-inv{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.ghost-inv:hover{background:rgba(255,255,255,.12)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa-inv{background:#fff;border-color:#fff;color:#1F8F5A}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.icon{padding:6px 8px;font-size:13px}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:14px}
.notice{background:var(--warn-tint);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stat .num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.stat.alert .num{color:var(--red)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.inp:focus{border-color:var(--red)}
.filters .search{flex:1 1 220px;min-width:0}
.filters select{flex:0 1 180px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list-head,.row{display:grid;grid-template-columns:78px minmax(0,1fr) 210px 80px 54px;gap:12px;align-items:center;padding:10px 14px}
.list-head{background:var(--sunk);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .c-id{display:grid;gap:1px}
.row .id{font-weight:800;font-variant-numeric:tabular-nums}
.row .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .subj{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .days{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.row .days small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.row.example{opacity:.6}
.tag-ej{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gray)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.list-foot{padding:10px 14px;background:var(--sunk);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (max-width:760px){
  .list-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id days" "main main" "st pr";gap:6px 10px}
  .row .c-id{grid-area:id;display:flex;gap:8px;align-items:baseline}
  .row .c-main{grid-area:main}.row .c-st{grid-area:st}.row .c-pr{grid-area:pr;justify-self:end}.row .c-days{grid-area:days}
}

/* Colores de estado */
.k-gris{background:var(--gray-tint);color:var(--ink)}
.k-azul{background:var(--info-tint);color:var(--info)}
.k-naranja{background:var(--warn-tint);color:var(--warn)}
.k-rojo{background:var(--red-tint);color:var(--red)}
.k-verde{background:var(--ok-tint);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st-wrap{position:relative;display:inline-flex;max-width:100%}
.st-wrap::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;pointer-events:none;color:inherit}
.st-sel{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;padding:4px 24px 4px 11px;font-size:12px;font-weight:700;max-width:100%;cursor:pointer}
.st-sel:hover{border-color:currentColor}
.st-sel option{background:var(--surface);color:var(--ink)}
.prio{font-size:12px;font-weight:700;color:var(--muted)}
.prio.p-alta{color:var(--warn)}
.prio.p-urgente{color:var(--red)}

/* Paneles */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--ground);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel-top{position:sticky;top:0;z-index:2;background:var(--red);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.panel-top.wa-top{background:#1F5C4F}
.panel-top h2{font-size:16px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.panel-top .x{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;padding:2px 8px}
.panel-body{padding:14px 16px;display:grid;gap:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;gap:10px;min-width:0}
.sec h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.help{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.f{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--muted);align-content:start;min-width:0}
.f .req{color:var(--red)}
.f .inp{font-weight:400;color:var(--ink);font-size:14px}
textarea.inp{min-height:64px;resize:vertical;line-height:1.45}
.f.full{grid-column:1/-1}
.f.bad .inp{border-color:var(--red)}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--red);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more .grid2{margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--red);font-weight:700}
.ai-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--wa-tint);border-radius:8px;padding:8px 12px;font-size:13px}
.ai-row .grow{flex:1;min-width:160px}

.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:12px 1fr;gap:9px;padding-bottom:10px;position:relative}
.log li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:5px;grid-row:1/3}
.log li:not(:last-child)::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}
.log li.sys::before{background:var(--surface);border:2px solid var(--gray)}
.log li.wa::before{background:var(--wa)}
.log .when{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .when b{color:var(--wa)}
.log .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.log li.sys .txt{color:var(--muted);font-size:12.5px}
.addnote{display:grid;gap:8px}
.wa-preview{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}

/* WhatsApp */
.msgs{border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto;background:var(--sunk)}
.msg{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.msg:last-child{border-bottom:0}
.msg input{margin-top:3px;accent-color:var(--red)}
.msg .who{display:block;font-size:12px;font-weight:700}
.msg.me .who{color:var(--info)}
.msg.them .who{color:var(--wa)}
.msg .who span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.msg .body{display:block;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.detect{display:flex;gap:6px;flex-wrap:wrap}
.detect span{background:var(--wa-tint);border-radius:999px;padding:3px 10px;font-size:12px}
.radio-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.radio-row label{display:flex;gap:6px;align-items:center;font-weight:600}
.radio-row input{accent-color:var(--red)}
.file-lbl input{position:absolute;width:1px;height:1px;opacity:0}

/* Editor de estados */
.est-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto 64px;padding-bottom:10px;border-bottom:1px solid var(--line);gap:8px;align-items:center}
.est-row .chk{display:flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap}
.est-row .chk input{accent-color:var(--red)}
.est-row .used{font-size:11.5px;color:var(--muted);white-space:nowrap}
.est-row .st-color{grid-column:1;grid-row:1}.est-row .name{grid-column:2;grid-row:1}.est-row [data-up]{grid-column:3;grid-row:1}.est-row [data-rm],.est-row .used{grid-column:4;grid-row:1}
.est-row .st-etapa{grid-column:1/3;grid-row:2}.est-row .chk{grid-column:3/5;grid-row:2}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 15px;border-radius:8px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .16s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.row .subj{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ro-val{font-size:14px;font-weight:600;color:var(--ink);padding:8px 0}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:4px;font-size:11px;padding:1px 5px}
.drop{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.drop.over{border-color:var(--red);background:var(--red-tint)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--wa);border-color:var(--wa);color:#fff}
.wa-link{color:var(--wa);font-weight:700;font-size:12.5px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.alerts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--red-tint);border:1px solid var(--red-line);border-radius:8px;padding:9px 12px;font-size:13px}
.alerts b{color:var(--red-deep);font-weight:800}
.al-chip{border:1px solid var(--red-line);background:var(--surface);color:var(--red);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.al-chip[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.al-chip.nuevo{color:var(--info);border-color:var(--line)}
.row-al{font-size:12px;font-weight:700;color:var(--red);margin-top:2px}
.al-box{background:var(--red-tint);border:1px solid var(--red-line);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--red-deep);display:grid;gap:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.toast{display:flex;gap:12px;align-items:center}
.toast button{background:var(--ground);color:var(--ink);border:0;border-radius:6px;padding:5px 10px;font-weight:700;font-size:12.5px}
</style>

  /* ---------- Traer de WhatsApp (chat con Tango) ---------- */
  var AMPM='([ap]\\.?\\s?m\\.?)';
  var RE_A=new RegExp('^\\[?(\\d{1,2})[\\/.-](\\d{1,2})(?:[\\/.-](\\d{2,4}))?,?\\s+(\\d{1,2}):(\\d{2})(?::\\d{2})?\\s*'+AMPM+'?\\]?\\s*(?:-\\s*)?(.*)$','i');
  var RE_B=new RegExp('^\\[(\\d{1,2}):(\\d{2})(?::\\d{2})?\\s*'+AMPM+'?,\\s*(\\d{1,2})[\\/.-](\\d{1,2})(?:[\\/.-](\\d{2,4}))?\\]\\s*(.*)$','i');
  function mkDate(d,m,y,h,mi,ap){
    d=+d;m=+m;h=+h;mi=+mi;var now=new Date();
    if(!y){y=now.getFullYear();if(new Date(y,m-1,d)-now>864e5)y--}else{y=+y;if(y<100)y+=2000}
    if(ap){var pm=/p/i.test(ap);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}
    var dt=new Date(y,m-1,d,h,mi);return (isNaN(dt)||m>12||d>31)?null:dt;
  }
  function parseChat(text){

      var line=raw.replace(/^[\u200e\u200f\ufeff\s]+/,'').replace(/[\u200e\u200f]/g,''),m,dt=null,rest=null;
      if((m=RE_B.exec(line))){dt=mkDate(m[4],m[5],m[6],m[1],m[2],m[3]);rest=m[7]}
      else if((m=RE_A.exec(line))){dt=mkDate(m[1],m[2],m[3],m[4],m[5],m[6]);rest=m[7]}
      if(dt){var c=rest.indexOf(': ');if(c>0&&c<60){cur={t:dt,autor:rest.slice(0,c).trim(),txt:rest.slice(c+2)};out.push(cur)}else cur=null;return}
      if(cur)cur.txt+='\n'+raw;
    });
    out.forEach(function(x){x.txt=x.txt.trim().replace(/<(Multimedia omitido|Media omitted)>/gi,'[archivo adjunto]');if(x.txt.length>2000)x.txt=x.txt.slice(0,2000)+'…'});

  }

    var names=[];msgs.forEach(function(m){if(names.indexOf(m.autor)<0)names.push(m.autor)});
    imp.me=names.filter(function(n){return !/tango|axoft|soporte|mesa de ayuda/i.test(n)})[0]||names[0];
    imp.sel={};var start=Math.max(0,msgs.length-40);if(msgs.length>40)imp.desde=isoDate(msgs[start].t);
    for(var i=start;i<msgs.length;i++)imp.sel[i]=true;
    renderImport();
  }
  function importGo(){
    var chosen=imp.msgs.filter(function(m,i){return imp.sel[i]});if(!chosen.length)return;
    var entries=chosen.map(function(m){return {t:m.t.toISOString(),tipo:'wa',autor:m.autor,txt:m.txt}});
    if(imp.dest==='existente'){
      var t=findItem(imp.target);if(!t){toast('Elegí a qué caso agregarlos.');return}
      var key=function(l){return l.t+'|'+l.autor+'|'+l.txt},have={};(t.log||[]).forEach(function(l){have[key(l)]=1});
      var add=entries.filter(function(l){return !have[key(l)]});
      if(!add.length){toast('Esos mensajes ya estaban.');imp=null;openTicket(t);return}
      var u=Object.assign({},t);u.log=(t.log||[]).concat(add);
      save(u).then(function(){toast(add.length+' mensajes agregados a '+codigo(u));imp=null;openTicket(u)},function(){});return;
    }
    var mine=chosen.filter(function(m){return m.autor===imp.me});imp=null;
    nuevo({asunto:mine.map(function(m){return m.txt}).filter(function(x){return x.charAt(0)!=='['}).slice(0,3).join('\n').slice(0,600),log:entries});
  }

  /* ---------- Editor de estados ---------- */
  function openEstados(){closePanel(true);estDraft=JSON.parse(JSON.stringify(ESTADOS));renderEstados()}
  function renderEstados(){
    var uso={};items.forEach(function(t){uso[t.estado]=(uso[t.estado]||0)+1});
    var h='<div class="overlay" data-ov="1"><aside class="panel" role="dialog" aria-modal="true" aria-labelledby="e-title"><div class="panel-top"><h2 id="e-title">Estados</h2><button type="button" class="x" data-a="close" aria-label="Cerrar">×</button></div><div class="panel-body">'+
      '<section class="sec"><p class="help">Renombrá, cambiá el color o el orden, o agregá estados. El primero es el que toma cada caso nuevo. La columna 📱 es la etapa que ve el solicitante en los avisos de WhatsApp. Los que no están “Abiertos” cierran el caso y completan la fecha de cierre.</p>'+
      estDraft.map(function(e,i){
        var n=uso[e.k]||0;
        return '<div class="est-row"><select class="inp st-color k-'+e.c+'" data-i="'+i+'" aria-label="Color">'+opts(COLORES,e.c,function(c){return c.k},function(c){return c.l})+'</select>'+
          '<input class="inp name" data-i="'+i+'" value="'+esc(e.l)+'" maxlength="40" aria-label="Nombre del estado">'+
          '<select class="inp st-etapa" data-i="'+i+'" aria-label="Lo que ve el solicitante">'+opts(ETAPAS,e.etapa||ETAPA_DEF[e.k]||(e.abierto===false?'solucionado':'gestion'),function(x){return x.k},function(x){return '📱 '+x.l})+'</select>'+
          '<label class="chk"><input type="checkbox" data-ab="'+i+'"'+(e.abierto!==false?' checked':'')+'> Abierto</label>'+
          '<button type="button" class="btn icon" data-up="'+i+'"'+(i===0?' disabled':'')+' aria-label="Subir">↑</button>'+
          (n?'<span class="used">'+n+' en uso</span>':'<button type="button" class="btn icon danger" data-rm="'+i+'" aria-label="Quitar">✕</button>')+
        '</div>';
      }).join('')+
      '<div class="actions"><button type="button" class="btn sm" data-a="e-add">+ Agregar estado</button><span class="spacer"></span><button type="button" class="btn sm" data-a="e-reset">Volver a los originales</button></div></section>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="e-save">Guardar estados</button></div>'+
      '</div></aside></div>';
    $('#panel-root').innerHTML=h;document.body.style.overflow='hidden';
    var root=$('#panel-root');
    root.querySelectorAll('input.name').forEach(function(x){x.addEventListener('input',function(){estDraft[+this.dataset.i].l=this.value})});
    root.querySelectorAll('select.st-color').forEach(function(x){x.addEventListener('change',function(){estDraft[+this.dataset.i].c=this.value;this.className='inp st-color k-'+this.value})});
    root.querySelectorAll('select.st-etapa').forEach(function(x){x.addEventListener('change',function(){estDraft[+this.dataset.i].etapa=this.value})});
    root.querySelectorAll('input[data-ab]').forEach(function(x){x.addEventListener('change',function(){estDraft[+this.dataset.ab].abierto=this.checked})});
  }
  function estadosGo(){
    var list=estDraft.map(function(e){return {k:e.k,l:(e.l||'').trim(),c:e.c,abierto:e.abierto!==false,etapa:e.etapa||ETAPA_DEF[e.k]||(e.abierto!==false?'gestion':'solucionado')}});
    if(list.some(function(e){return !e.l})){toast('Todos los estados necesitan un nombre.');return}
    if(!list.length){toast('Tiene que haber al menos un estado.');return}
    saveEstados(list).then(function(){toast('Estados guardados');closePanel()},function(){});
  }

  /* ---------- Contactos ---------- */
  function openContactos(){closePanel(true);contDraft=JSON.parse(JSON.stringify(CONTACTOS));renderContactos()}
  function renderContactos(){
    var h='<div class="overlay" data-ov="1"><aside class="panel" role="dialog" aria-modal="true" aria-labelledby="c-title"><div class="panel-top"><h2 id="c-title">Contactos</h2><button type="button" class="x" data-a="close" aria-label="Cerrar">×</button></div><div class="panel-body">'+
      '<section class="sec"><p class="help">Cada persona con su sector y celular. Al elegirla en “Pedido por”, el caso toma su celular y sector solos. Si alguien carga un celular nuevo en un caso, se suma acá automáticamente.</p>'+
      (contDraft.length?contDraft.map(function(c,i){
        return '<div class="est-row" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto">'+
          '<input class="inp c-n" data-i="'+i+'" data-k="n" value="'+esc(c.n)+'" placeholder="Nombre y apellido" aria-label="Nombre">'+
          '<select class="inp" data-i="'+i+'" data-k="s" aria-label="Sector">'+opts(SECTORES,c.s,id_,id_,'Sector…')+'</select>'+
          '<input class="inp" type="tel" data-i="'+i+'" data-k="c" value="'+esc(c.c)+'" placeholder="Celular" aria-label="Celular">'+
          '<button type="button" class="btn icon danger" data-rmc="'+i+'" aria-label="Quitar">✕</button></div>';
      }).join(''):'<p class="help">Todavía no hay contactos.</p>')+
      '<div class="actions"><button type="button" class="btn sm" data-a="c-add">+ Agregar persona</button></div></section>'+
      '<section class="sec"><h3>Pegar una lista</h3><p class="help">Una persona por renglón: <b>Nombre; Sector; Celular</b>. Podés copiar las tres columnas desde Excel.</p>'+
      '<textarea class="inp" id="c-bulk" placeholder="Lucía Gómez; Ventas; 11 5555-0192&#10;Pedro Díaz; Depósito / Stock; 351 444-1234"></textarea>'+
      '<div class="actions"><button type="button" class="btn sm" data-a="c-bulk">Agregar a la lista</button></div></section>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="c-save">Guardar contactos</button></div>'+
      '</div></aside></div>';
    $('#panel-root').innerHTML=h;document.body.style.overflow='hidden';
    $('#panel-root').querySelectorAll('[data-k]').forEach(function(x){x.addEventListener(x.tagName==='SELECT'?'change':'input',function(){contDraft[+this.dataset.i][this.dataset.k]=this.value})});
  }
  function bulkContactos(){
    var txt=($('#c-bulk').value||'').trim();if(!txt)return;
    var n=0,low=SECTORES.map(function(s){return s.toLowerCase()});
    txt.split(/\n/).forEach(function(l){
      var p=l.split(/\t|;|,(?=\s*[^\d\s])|\s\|\s/).map(function(x){return x.trim()}).filter(Boolean);if(!p.length)return;
      var name=p[0],sec='',cel='';
      p.slice(1).forEach(function(x){if(/\d{6,}/.test(x.replace(/\D/g,'')))cel=x;else{var i=low.indexOf(x.toLowerCase());sec=i>=0?SECTORES[i]:(SECTORES.filter(function(s){return s.toLowerCase().indexOf(x.toLowerCase())===0})[0]||'')}});
      var ex=contDraft.filter(function(c){return c.n.trim().toLowerCase()===name.toLowerCase()})[0];
      if(ex){if(cel)ex.c=cel;if(sec)ex.s=sec}else contDraft.push({n:name,s:sec,c:cel});n++;
    });
    renderContactos();toast(n+' persona'+(n===1?'':'s')+' en la lista. Revisá y guardá.');
  }
  function contactosGo(){
    var list=contDraft.map(function(c){return {n:(c.n||'').trim(),s:c.s||'',c:(c.c||'').trim()}}).filter(function(c){return c.n});
    saveContactos(list).then(function(){toast('Contactos guardados');closePanel()},function(){});
  }

  /* ---------- utilidades ---------- */
  function copy(txt){
    var ok=function(){toast('Copiado. Pegalo en WhatsApp.')},fb=function(){var el=$('#wa-txt');if(!el){toast('No se pudo copiar.');return}var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto seleccionado: copialo con Ctrl+C')};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
  }
  function csv(){
    var cols=['Caso','Cargado el','Usuario solicitante','Celular','Sector','Tipo','Sistema','Incidente','Mensaje de error','Capturas','Prioridad','Estado','Cerrado el','Días','Solución'];
    var q=function(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'},lines=[cols.map(q).join(';')];
    items.slice().sort(function(a,b){return a.num-b.num}).forEach(function(t){
      lines.push([codigo(t),fmtDT(t.pedidoEl),t.pedidoPor,t.celular,t.sector,t.tipo,prov(t),queSucede(t),t.errorMsg,(t.imgs||[]).length,prio(t.prioridad).l,est(t.estado).l,cerrado(t)?fmtDT(cerrado(t)):'',dias(fecha(t),isOpen(t)?null:(cerrado(t)||fecha(t)).slice(0,10)),t.solucion].map(q).join(';'))});
    downloads.save({filename:'soportes-tango-'+hoy()+'.csv',data:'\ufeff'+lines.join('\r\n')}).then(function(){toast('CSV listo')},function(){});
  }
  function addNote(){
    var ta=$('#p-nota'),txt=ta.value.trim();if(!txt){ta.focus();return}
    var cur=findItem(openId);if(!cur)return;
    var parsed=parseChat(txt),add;
    if(parsed.length){var have={};(cur.log||[]).forEach(function(l){have[l.t+'|'+l.autor+'|'+l.txt]=1});add=parsed.map(function(m){return {t:m.t.toISOString(),tipo:'wa',autor:m.autor,txt:m.txt}}).filter(function(l){return !have[l.t+'|'+l.autor+'|'+l.txt]});if(!add.length){toast('Ya estaban.');return}}
    else add=[{t:new Date().toISOString(),tipo:'nota',txt:txt}];
    var u=Object.assign({},cur);u.log=(cur.log||[]).concat(add);
    save(u).then(function(){toast('Agregado');openTicket(findItem(openId)||u)},function(){});
  }
  function avisoTexto(t){return msg(isOpen(t)?'estado':'cerrado',t)}

  /* ---------- eventos ---------- */
  document.addEventListener('change',function(ev){
    var s=ev.target.closest&&ev.target.closest('select[data-st]');if(!s)return;
    var t=findItem(s.dataset.st);if(!t)return;
    var u=withEstado(t,s.value);
    save(u).then(function(){
      var txt=avisoTexto(u),link=waLink(u.celular,txt);
      toast(codigo(u)+' → '+est(u.estado).l,link?'Avisar por WhatsApp':'Copiar aviso',function(){var w=null;if(link){try{w=window.open(link,'_blank')}catch(e){}}if(!w)copy(txt);var cur=findItem(u.id);if(cur){var v=Object.assign({},cur);v.avisar=false;v.log=(cur.log||[]).concat([{t:new Date().toISOString(),tipo:'sys',txt:'Aviso al solicitante · '+(isOpen(u)?'Cambio de estado':'Cerrado')}]);save(v).catch(function(){})}});
    },function(){render()});
  });
  document.addEventListener('click',function(ev){var l=ev.target.closest&&ev.target.closest('#wa-open');if(l&&!ro&&draft&&!draft._nuevo)registrarEnvio(waTab)},true);
  document.addEventListener('paste',function(ev){
    if(!draft||!$('#drop'))return;
    var fs=[];Array.prototype.forEach.call((ev.clipboardData&&ev.clipboardData.items)||[],function(it){if(it.kind==='file'&&/^image\//.test(it.type)){var f=it.getAsFile();if(f)fs.push(f)}});
    if(fs.length){ev.preventDefault();addFiles(fs)}
  });
  document.addEventListener('click',function(ev){
    if(ev.target.closest('#lb-root .lightbox')){$('#lb-root').innerHTML='';return}
    if(ev.target.dataset&&ev.target.dataset.ov){closePanel();return}
    if(ev.target.closest('.st-wrap'))return;
    var view=ev.target.closest('img[data-view]');
    if(view&&view.src){$('#lb-root').innerHTML='<div class="lightbox" role="dialog" aria-label="Captura"><img src="'+view.src+'" alt="Captura"></div>';return}
    var row=ev.target.closest('.row');
    if(row&&!ev.target.closest('button')){
      if(row.dataset.ej){toast('Es un ejemplo. Cargá el primer caso con “+ Nuevo”.');return}
      var t=findItem(row.dataset.id);if(t)openTicket(t);return;
    }
    var b=ev.target.closest('button');if(!b)return;
    if(b.id==='toast-btn'){if(toastFn)toastFn();$('#toast').hidden=true;return}
    if(b.id==='btn-new'){nuevo();return}
    if(b.id==='btn-wa'){openImport();return}
    if(b.id==='btn-est'){openEstados();return}
    if(b.id==='btn-cont'){openContactos();return}
    if(b.dataset.rmc){contDraft.splice(+b.dataset.rmc,1);renderContactos();return}
    if(b.dataset.a==='c-add'){contDraft.push({n:'',s:'',c:''});renderContactos();var cs=document.querySelectorAll('input.c-n');if(cs.length)cs[cs.length-1].focus();return}
    if(b.dataset.a==='c-bulk'){bulkContactos();return}
    if(b.dataset.a==='c-save'){contactosGo();return}
    if(b.id==='btn-csv'){csv();return}
    if(b.dataset.est){filt.est=b.dataset.est;render();return}
    if(b.dataset.tab){waTab=b.dataset.tab;renderMsg();if(b.dataset.go){var ww=$('#wa-txt');if(ww)ww.scrollIntoView({behavior:'smooth',block:'center'})}return}
    if(b.dataset.rmimg){var i=draft.imgs.indexOf(b.dataset.rmimg);if(i>=0){var rid=draft.imgs.splice(i,1)[0];var saved=findItem(draft.id);if(!saved||(saved.imgs||[]).indexOf(rid)<0)delImg(rid)}renderImgs();renderMsg();return}
    if(b.dataset.up){var j=+b.dataset.up;var x=estDraft[j];estDraft[j]=estDraft[j-1];estDraft[j-1]=x;renderEstados();return}
    if(b.dataset.rm){estDraft.splice(+b.dataset.rm,1);renderEstados();return}
    var a=b.dataset.a;
    if(a==='close'){if(aiCtl)aiCtl.abort();if(draft&&draft._nuevo)(draft.imgs||[]).forEach(delImg);closePanel();return}
    if(a==='copy'){copy($('#wa-txt').textContent);if(!ro&&draft&&!draft._nuevo)registrarEnvio(waTab);return}
    if(a==='ai'){completarIA(b);return}
    if(a==='del'){$('#del-slot').innerHTML='<span class="confirm">¿Borrar? <button type="button" class="btn danger sm" data-a="del-yes">Sí</button><button type="button" class="btn sm" data-a="del-no">No</button></span>';return}
    if(a==='del-no'){$('#del-slot').innerHTML='<button type="button" class="btn danger sm" data-a="del">Borrar</button>';return}
    if(a==='del-yes'){var tt=findItem(openId);closePanel();if(tt)remove(tt).then(function(){toast('Borrado')});return}
    if(a==='note'){addNote();return}
    if(a==='wa-here'){openImport(openId);return}
    if(a==='w-parse'){parseImport(false);return}
    if(a==='w-back'){imp.step=1;renderImport();return}
    if(a==='w-all'){imp.msgs.forEach(function(m,i){if(!imp.desde||isoDate(m.t)>=imp.desde)imp.sel[i]=true});keepScroll();return}
    if(a==='w-none'){imp.sel={};keepScroll();return}
    if(a==='w-go'){importGo();return}
    if(a==='e-add'){estDraft.push({k:'e'+Date.now().toString(36),l:'Nuevo estado',c:'azul',abierto:true});renderEstados();var ins=document.querySelectorAll('input.name');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}return}
    if(a==='e-reset'){var used={};items.forEach(function(t){used[t.estado]=1});var base=JSON.parse(JSON.stringify(ESTADOS_DEF));estDraft.forEach(function(e){if(used[e.k]&&!base.some(function(b){return b.k===e.k}))base.push(e)});estDraft=base;renderEstados();return}
    if(a==='e-save'){estadosGo();return}
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){if($('#lb-root').innerHTML){$('#lb-root').innerHTML='';return}if($('#panel-root').innerHTML){closePanel();return}}
    if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('row'))ev.target.click();
  });
  $('#q').addEventListener('input',function(){filt.q=this.value;if(filt.q&&filt.est==='abiertos')filt.est='todos';render()});
  $('#f-mod').innerHTML='<option value="">Todos los sistemas</option>'+PROVEEDORES.map(function(m){return '<option>'+esc(m)+'</option>'}).join('');
  $('#f-mod').addEventListener('change',function(){filt.mod=this.value;render()});
  $('#f-sector').innerHTML='<option value="">Todos los sectores</option>'+SECTORES.map(function(m){return '<option>'+esc(m)+'</option>'}).join('');
  $('#f-sector').addEventListener('change',function(){filt.sector=this.value;render()});

  setInterval(function(){if(!$('#panel-root').innerHTML)render()},300000);
  /* ---------- arranque ---------- */
  render();
  var started=false;
  function useLocal(){
    if(started)return;started=true;mode='local';items=lsGet(LS,[]);var e=lsGet(LS_EST,null);if(e&&e.length)ESTADOS=e;CONTACTOS=lsGet(LS+'-contactos',[]);
    var n=$('#notice');n.hidden=false;n.textContent='Sin conexión con la base compartida: lo que cargues queda solo en este navegador.';render();
  }
  var c=window.claude;
  if(!c||!c.use)useLocal();
  else{
    c.use('downloads').then(function(d){downloads=d;render()},function(){});
    c.use('sample').then(function(s){sample=s||null},function(){});
    c.use('db').then(function(d){
      if(!d){useLocal();return}
      db=d;col=db.collection('soportes');imgCol=db.collection('imagenes');cfgRef=db.doc('config/estados');contRef=db.doc('config/contactos');started=true;mode='db';
      contRef.onSnapshot(function(s){var x=s.exists&&s.data();CONTACTOS=(x&&Array.isArray(x.lista))?x.lista:[];},function(){});
      cfgRef.onSnapshot(function(s){var x=s.exists&&s.data();ESTADOS=(x&&Array.isArray(x.lista)&&x.lista.length)?x.lista:ESTADOS_DEF.slice();render()},function(){});
      col.limit(1000).onSnapshot(function(snap){items=snap.docs.map(function(s){var x=s.data()||{};x.id=s.id;return x});render();fixNums()},
        function(e){if(e&&(e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')){started=false;useLocal()}});
    },function(){useLocal()});
    c.use('user').then(function(u){
      if(!u)return;
      if(u.can)Promise.resolve(u.can('data.write')).then(function(ok){if(ok===false)readOnly()});
      if(u.me)u.me().then(function(m){if(m&&m.name)meName=m.name},function(){});
    },function(){});
  }
})();
</script>
