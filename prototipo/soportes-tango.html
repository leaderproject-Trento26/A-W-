<title>Soportes Tango · Trento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --red:#D71F2B; --red-deep:#A3131D; --red-tint:#FBE9EA; --red-line:#F2C6C9;
  --ink:#231A1B; --muted:#6F6263; --line:#E7DEDE; --ground:#F4EFEF; --surface:#FFFFFF; --sunk:#FAF7F7;
  --ok:#1D8A56; --ok-tint:#E4F4EC; --warn:#B86F00; --warn-tint:#FCF1DC; --info:#2B5DA8; --info-tint:#E6EEF9;
  --gray:#7D7274; --gray-tint:#EEE8E8; --wa:#1F8F5A;
  --on-red:#FFFFFF; --overlay:rgba(35,26,27,.45);
  --shadow:0 18px 40px -20px rgba(90,20,25,.35);
  --font:"Open Sans", Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
    --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
    --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
    --gray:#A89C9D; --gray-tint:#2C2425; --wa:#4CC08A; --overlay:rgba(0,0,0,.6);
    --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
  --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
  --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
  --gray:#A89C9D; --gray-tint:#2C2425; --wa:#4CC08A; --overlay:rgba(0,0,0,.6);
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}

/* Barra roja de marca */
.band{background:var(--red);color:var(--on-red);padding-inline:16px}
.band-in{max-width:1120px;margin:0 auto;padding-block:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-chip{background:#fff;border-radius:6px;padding:6px 10px;display:flex;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.logo-chip img{height:30px;display:block}
.band h1{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.band .sub{font-size:13px;opacity:.9}
.band .grow{flex:1;min-width:200px}
.band-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;line-height:1.1}
.btn:hover{border-color:var(--red-line)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.inv{background:#fff;border-color:#fff;color:#A3131D}
.btn.inv:hover{background:#FBE9EA}
.btn.ghost-inv{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.ghost-inv:hover{background:rgba(255,255,255,.12)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.sm{padding:6px 10px;font-size:12.5px}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}

.notice{background:var(--warn-tint);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;text-align:left}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--red-line)}
.stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .num{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .hint{font-size:12px;color:var(--muted)}
.stat.alert .num{color:var(--red)}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:1/-1}}

/* Filtros */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px}
.inp:focus{border-color:var(--red)}
.filters .search{flex:1 1 240px;min-width:0}
.filters select{flex:0 1 190px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}

/* Lista */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list-head,.row{display:grid;grid-template-columns:96px minmax(0,1fr) 190px 88px 70px;gap:14px;align-items:center;padding:12px 16px}
.list-head{background:var(--sunk);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.row{border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .id{font-weight:800;font-variant-numeric:tabular-nums}
.row .c-id{display:grid;gap:1px}
.row .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .subj{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .days{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.row .days small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.row.example{opacity:.62}
.tag-ej{display:block;width:max-content;margin-bottom:2px;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--gray-tint);color:var(--gray);border-radius:4px;padding:1px 6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.list-foot{padding:12px 16px;background:var(--sunk);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (max-width:760px){
  .list-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id days" "main main" "st pr";gap:6px 10px}
  .row .c-id{grid-area:id;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row .c-main{grid-area:main}
  .row .c-st{grid-area:st}
  .row .c-pr{grid-area:pr;justify-self:end}
  .row .c-days{grid-area:days}
}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-enviado{background:var(--info-tint);color:var(--info)}
.st-analisis{background:var(--warn-tint);color:var(--warn)}
.st-nuestra{background:var(--red-tint);color:var(--red)}
.st-resuelto{background:var(--ok-tint);color:var(--ok)}
.st-cancelado{background:var(--gray-tint);color:var(--gray)}
.prio{font-size:12px;font-weight:700;color:var(--muted)}
.prio.p-alta{color:var(--warn)}
.prio.p-urgente{color:var(--red)}
.prio .bars{display:inline-flex;gap:2px;margin-right:5px;vertical-align:-1px}
.prio .bars i{width:4px;height:10px;border-radius:1px;background:var(--line)}
.prio .bars i.on{background:currentColor}

/* Panel lateral */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--ground);width:min(620px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel-top{position:sticky;top:0;z-index:2;background:var(--red);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.panel-top h2{font-size:17px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.panel-top .x{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;padding:4px 8px}
.panel-body{padding:16px;display:grid;gap:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
.sec h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.f{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.f .inp{font-weight:400;color:var(--ink);font-size:14px}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.f.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--red);font-weight:700}

/* Seguimiento */
.log{display:grid;gap:0;list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.log li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:4px;grid-row:1/3}
.log li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.log li.sys::before{background:var(--line);border:2px solid var(--gray)}
.log .when{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.log li.sys .txt{color:var(--muted);font-size:13px}
.addnote{display:grid;gap:8px}
.addnote textarea{min-height:64px}

.wa-preview{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<script>
(function(){
  var ESTADOS=[
    {k:'enviado',  l:'Enviado a Tango',        c:'st-enviado'},
    {k:'analisis', l:'Tango lo está viendo',   c:'st-analisis'},
    {k:'nuestra',  l:'Espera respuesta nuestra',c:'st-nuestra'},
    {k:'resuelto', l:'Resuelto',               c:'st-resuelto'},
    {k:'cancelado',l:'Cancelado',              c:'st-cancelado'}
  ];
  var ABIERTOS=['enviado','analisis','nuestra'];
  var PRIOS=[{k:'baja',l:'Baja',n:1},{k:'media',l:'Media',n:2},{k:'alta',l:'Alta',n:3},{k:'urgente',l:'Urgente',n:4}];
  var MODULOS=['Ventas','Compras','Stock','Tesorería','Contabilidad','Sueldos','Facturación electrónica / ARCA','Cuentas corrientes','Central / Administración','Instalación y licencias','Reportes / Tango Live','Otro'];

  var EJEMPLOS=[
    {id:'ej1',num:3,fecha:hoyMas(-1),modulo:'Facturación electrónica / ARCA',asunto:'Error al solicitar CAE en factura A',detalle:'Rechazo 10016 al emitir desde el punto de venta 0004.',prioridad:'urgente',estado:'analisis',pedidoPor:'Milena',tecnico:'Técnico de Tango',casoTango:'—',log:[]},
    {id:'ej2',num:2,fecha:hoyMas(-4),modulo:'Stock',asunto:'Diferencia de saldo en depósito 02',detalle:'El informe de saldos no coincide con el control de stock.',prioridad:'media',estado:'nuestra',pedidoPor:'Milena',tecnico:'Técnico de Tango',casoTango:'—',log:[]},
    {id:'ej3',num:1,fecha:hoyMas(-9),modulo:'Instalación y licencias',asunto:'Activar licencia en puesto nuevo',detalle:'',prioridad:'baja',estado:'resuelto',resueltoEl:hoyMas(-7),pedidoPor:'Milena',tecnico:'Técnico de Tango',casoTango:'—',log:[]}
  ];

  var items=[], db=null, col=null, mode='loading', downloads=null;
  var filt={q:'',mod:'',est:'abiertos'};
  var openId=null;
  var LS='trento-soportes-tango-v1';

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function hoy(){return isoDate(new Date())}
  function hoyMas(n){var d=new Date();d.setDate(d.getDate()+n);return isoDate(d)}
  function fmtD(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
  function fmtDT(iso){var d=new Date(iso);if(isNaN(d))return '';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
  function dias(a,b){var x=new Date(a+'T12:00:00'),y=new Date((b||hoy())+'T12:00:00');return Math.max(0,Math.round((y-x)/864e5))}
  function codigo(t){return 'S-'+String(t.num||0).padStart(4,'0')}
  function est(k){for(var i=0;i<ESTADOS.length;i++)if(ESTADOS[i].k===k)return ESTADOS[i];return ESTADOS[0]}
  function prio(k){for(var i=0;i<PRIOS.length;i++)if(PRIOS[i].k===k)return PRIOS[i];return PRIOS[1]}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}

  /* ---------- almacenamiento ---------- */
  function lsLoad(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):[]}catch(e){return []}}
  function lsSave(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}

  function save(t){
    t.actualizado=new Date().toISOString();
    var data=JSON.parse(JSON.stringify(t));delete data.id;
    if(mode==='db'){
      return col.doc(t.id).set(data).catch(function(e){
        if(e&&e.code==='invalid_argument'){readOnly();toast('No tenés permiso para guardar cambios en este tablero.')}
        else toast('No se pudo guardar. Probá de nuevo en unos segundos.');
        throw e;
      });
    }
    var i=items.findIndex(function(x){return x.id===t.id});
    if(i<0)items.push(t);else items[i]=t;
    lsSave();render();return Promise.resolve();
  }
  function remove(id){
    if(mode==='db')return col.doc(id).delete().catch(function(){toast('No se pudo borrar.')});
    items=items.filter(function(x){return x.id!==id});lsSave();render();return Promise.resolve();
  }
  function newId(){return (mode==='db'&&col)?col.doc().id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  var ro=false;
  function readOnly(){ro=true;$('#btn-new').hidden=true;render();}

  /* ---------- render ---------- */
  function visibles(){
    var q=filt.q.trim().toLowerCase();
    return items.filter(function(t){
      if(filt.mod&&t.modulo!==filt.mod)return false;
      if(filt.est==='abiertos'&&ABIERTOS.indexOf(t.estado)<0)return false;
      if(filt.est==='tango'&&t.estado!=='enviado'&&t.estado!=='analisis')return false;
      if(['abiertos','todos','tango'].indexOf(filt.est)<0&&t.estado!==filt.est)return false;
      if(q){var h=[codigo(t),t.asunto,t.detalle,t.modulo,t.tecnico,t.casoTango,t.pedidoPor].join(' ').toLowerCase();if(h.indexOf(q)<0)return false}
      return true;
    }).sort(function(a,b){
      var ao=ABIERTOS.indexOf(a.estado)>=0?0:1,bo=ABIERTOS.indexOf(b.estado)>=0?0:1;
      if(ao!==bo)return ao-bo;
      if(ao===0&&prio(b.prioridad).n!==prio(a.prioridad).n)return prio(b.prioridad).n-prio(a.prioridad).n;
      return (b.num||0)-(a.num||0);
    });
  }

  function renderStats(){
    var src=items.length?items:[];
    var ab=src.filter(function(t){return ABIERTOS.indexOf(t.estado)>=0});
    var tango=src.filter(function(t){return t.estado==='enviado'||t.estado==='analisis'});
    var nuestra=src.filter(function(t){return t.estado==='nuestra'});
    var mes=hoy().slice(0,7);
    var resMes=src.filter(function(t){return t.estado==='resuelto'&&(t.resueltoEl||'').slice(0,7)===mes});
    var res=src.filter(function(t){return t.estado==='resuelto'&&t.resueltoEl});
    var prom=res.length?(res.reduce(function(s,t){return s+dias(t.fecha,t.resueltoEl)},0)/res.length):null;
    var viejo=ab.reduce(function(m,t){return Math.max(m,dias(t.fecha))},0);
    $('#stats').innerHTML=
      stat('abiertos','Abiertos',ab.length,ab.length?('El más antiguo: '+viejo+' d'):'Nada pendiente',false)+
      stat('tango','Esperando a Tango',tango.length,'Enviados o en análisis',false)+
      stat('nuestra','Esperan respuesta nuestra',nuestra.length,nuestra.length?'Tango nos pidió algo':'Nada nos espera',nuestra.length>0)+
      stat('resuelto','Resueltos este mes',resMes.length,'Mes '+mes.slice(5)+'/'+mes.slice(0,4),false)+
      '<div class="stat"><span class="lbl">Resolución promedio</span><span class="num">'+(prom==null?'—':prom.toFixed(1).replace('.',','))+'</span><span class="hint">días desde el pedido</span></div>';
  }
  function stat(k,l,n,h,alert){
    return '<button type="button" class="stat'+(alert?' alert':'')+'" data-stat="'+k+'"><span class="lbl">'+esc(l)+'</span><span class="num">'+n+'</span><span class="hint">'+esc(h)+'</span></button>';
  }

  function renderChips(){
    var cnt=function(f){return items.filter(f).length};
    var defs=[{k:'abiertos',l:'Abiertos',n:cnt(function(t){return ABIERTOS.indexOf(t.estado)>=0})}]
      .concat(ESTADOS.map(function(e){return {k:e.k,l:e.l,n:cnt(function(t){return t.estado===e.k})}}))
      .concat([{k:'todos',l:'Todos',n:items.length}]);
    $('#chips').innerHTML=defs.map(function(d){return '<button type="button" class="chip" data-est="'+d.k+'" aria-pressed="'+(filt.est===d.k)+'">'+esc(d.l)+'<span class="c">'+d.n+'</span></button>'}).join('');
  }

  function rowHTML(t,ej){
    var e=est(t.estado),p=prio(t.prioridad);
    var cerrado=ABIERTOS.indexOf(t.estado)<0;
    var d=dias(t.fecha,cerrado?(t.resueltoEl||t.fecha):null);
    var bars='';for(var i=1;i<=4;i++)bars+='<i class="'+(i<=p.n?'on':'')+'"></i>';
    return '<button type="button" class="row'+(ej?' example':'')+'" data-id="'+esc(t.id)+'"'+(ej?' data-ej="1"':'')+'>'+
      '<div class="c-id"><span class="id">'+(ej?'<span class="tag-ej">EJEMPLO</span>':'')+codigo(t)+'</span><span class="date">'+fmtD(t.fecha)+'</span></div>'+
      '<div class="c-main"><div class="subj">'+esc(t.asunto||'(sin asunto)')+'</div><div class="meta">'+esc(t.modulo||'Sin módulo')+(t.casoTango&&t.casoTango!=='—'?' · Caso Tango '+esc(t.casoTango):'')+(t.tecnico?' · '+esc(t.tecnico):'')+'</div></div>'+
      '<div class="c-st"><span class="pill '+e.c+'">'+esc(e.l)+'</span></div>'+
      '<div class="c-pr"><span class="prio p-'+p.k+'"><span class="bars" aria-hidden="true">'+bars+'</span>'+p.l+'</span></div>'+
      '<div class="c-days days">'+d+'<small>'+(cerrado?'tardó':'abierto')+'</small></div>'+
    '</button>';
  }

  function render(){
    renderStats();renderChips();
    $('#btn-csv').hidden=!(downloads&&items.length);
    var rows=$('#rows'),foot=$('#foot');
    if(mode==='loading'){rows.innerHTML='<div class="empty">Cargando soportes…</div>';foot.textContent='';return}
    if(!items.length){
      rows.innerHTML=EJEMPLOS.map(function(t){return rowHTML(t,true)}).join('');
      foot.textContent=ro?'Todavía no hay soportes cargados.':'Estos son ejemplos para que veas cómo queda. Desaparecen cuando cargás tu primer soporte con “+ Nuevo soporte”.';
      return;
    }
    var v=visibles();
    rows.innerHTML=v.length?v.map(function(t){return rowHTML(t,false)}).join(''):'<div class="empty">No hay soportes con estos filtros.</div>';
    foot.textContent='Mostrando '+v.length+' de '+items.length+' soportes'+(mode==='local'?' · guardados solo en este navegador':'');
  }

  /* ---------- panel ---------- */
  function opts(list,sel,getK,getL){return list.map(function(x){var k=getK(x);return '<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>'+esc(getL(x))+'</option>'}).join('')}

  function waText(t){
    var e=est(t.estado);
    if(!t._nuevo&&t.casoTango&&t.casoTango!=='—'){
      return 'Hola, les escribo de Trento por el caso '+t.casoTango+' ('+(t.modulo||'Tango')+'): '+(t.asunto||'')+'.\n¿Tienen novedades? Nuestra referencia interna es '+codigo(t)+'. Gracias.';
    }
    return 'Hola, les escribo de Trento'+(t.pedidoPor?' ('+t.pedidoPor+')':'')+'. Necesitamos soporte con Tango.\n'+
      'Módulo: '+(t.modulo||'—')+'\n'+
      'Asunto: '+(t.asunto||'—')+'\n'+
      (t.detalle?'Detalle: '+t.detalle+'\n':'')+
      'Prioridad: '+prio(t.prioridad).l+'\n'+
      'Referencia interna: '+codigo(t);
  }

  function openPanel(t){
    openId=t.id;
    var nuevo=!!t._nuevo;
    var e=est(t.estado);
    var log=(t.log||[]).slice().reverse();
    var dis=ro?' disabled':'';
    var html='<div class="overlay" id="ov"><aside class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">'+
      '<div class="panel-top"><h2 id="p-title">'+(nuevo?'Nuevo soporte · '+codigo(t):codigo(t)+' · '+esc(t.asunto||''))+'</h2><button type="button" class="x" data-a="close" aria-label="Cerrar">×</button></div>'+
      '<div class="panel-body">'+
      '<form class="sec" id="frm"><h3>Pedido</h3>'+
        '<label class="f full">Asunto<input class="inp" id="p-asunto" name="asunto" required maxlength="140" value="'+esc(t.asunto)+'" placeholder="Ej.: No deja cerrar el período de IVA"'+dis+'></label>'+
        '<div class="grid2">'+
          '<label class="f">Módulo de Tango<select class="inp" id="p-modulo" name="modulo"'+dis+'>'+opts(MODULOS,t.modulo,function(x){return x},function(x){return x})+'</select></label>'+
          '<label class="f">Prioridad<select class="inp" id="p-prioridad" name="prioridad"'+dis+'>'+opts(PRIOS,t.prioridad,function(x){return x.k},function(x){return x.l})+'</select></label>'+
          '<label class="f">Fecha del pedido<input class="inp" id="p-fecha" name="fecha" type="date" value="'+esc(t.fecha)+'"'+dis+'></label>'+
          '<label class="f">Estado<select class="inp" id="p-estado" name="estado"'+dis+'>'+opts(ESTADOS,t.estado,function(x){return x.k},function(x){return x.l})+'</select></label>'+
          '<label class="f">Pedido por (Trento)<input class="inp" id="p-pedido" name="pedidoPor" value="'+esc(t.pedidoPor)+'" placeholder="Quién lo pidió"'+dis+'></label>'+
          '<label class="f">Técnico de Tango<input class="inp" id="p-tecnico" name="tecnico" value="'+esc(t.tecnico)+'" placeholder="Nombre del que atiende"'+dis+'></label>'+
          '<label class="f">N° de caso de Tango<input class="inp" id="p-caso" name="casoTango" value="'+esc(t.casoTango)+'" placeholder="Si te dieron uno"'+dis+'></label>'+
          '<label class="f">Resuelto el<input class="inp" id="p-resuelto" name="resueltoEl" type="date" value="'+esc(t.resueltoEl)+'"'+dis+'></label>'+
        '</div>'+
        '<label class="f full">Detalle del problema<textarea class="inp" id="p-detalle" name="detalle" placeholder="Qué pasa, en qué pantalla, mensaje de error, desde cuándo…"'+dis+'>'+esc(t.detalle)+'</textarea></label>'+
        (ro?'':'<div class="actions"><button type="submit" class="btn primary">'+(nuevo?'Guardar soporte':'Guardar cambios')+'</button>'+
          '<span class="spacer"></span>'+(nuevo?'':'<span id="del-slot"><button type="button" class="btn danger sm" data-a="del">Borrar</button></span>')+'</div>')+
      '</form>'+
      '<section class="sec"><h3>Mensaje para WhatsApp</h3>'+
        '<p style="font-size:13px;color:var(--muted)">'+(nuevo||!t.casoTango||t.casoTango==='—'?'Texto para mandar el pedido al soporte de Tango.':'Texto para pedir novedades del caso.')+' Copialo y pegalo en el chat.</p>'+
        '<div class="wa-preview" id="wa-txt">'+esc(waText(t))+'</div>'+
        '<div class="actions"><button type="button" class="btn wa sm" data-a="copy">Copiar mensaje</button></div>'+
      '</section>'+
      (nuevo?'':'<section class="sec"><h3>Seguimiento</h3>'+
        (ro?'':'<div class="addnote"><textarea class="inp" id="p-nota" placeholder="Qué respondió Tango, qué hicimos, próximos pasos…"></textarea><div class="actions"><button type="button" class="btn sm" data-a="note">Agregar al seguimiento</button></div></div>')+
        (log.length?'<ul class="log">'+log.map(function(l){return '<li class="'+(l.tipo==='sys'?'sys':'')+'"><span class="when">'+fmtDT(l.t)+'</span><span class="txt">'+esc(l.txt)+'</span></li>'}).join('')+'</ul>':'<p style="color:var(--muted);font-size:13px">Sin anotaciones todavía.</p>')+
      '</section>')+
      '</div></aside></div>';
    $('#panel-root').innerHTML=html;
    document.body.style.overflow='hidden';
    var first=$('#p-asunto');if(first&&nuevo)first.focus();
    var frm=$('#frm');
    frm.addEventListener('submit',function(ev){ev.preventDefault();submit(t)});
    frm.addEventListener('input',function(){ // actualiza la vista previa del mensaje
      var draft=Object.assign({},t,readForm());$('#wa-txt').textContent=waText(draft);
    });
    $('#p-estado')&&$('#p-estado').addEventListener('change',function(){
      if(this.value==='resuelto'&&!$('#p-resuelto').value)$('#p-resuelto').value=hoy();
    });
  }
  function readForm(){
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():''};
    return {asunto:g('p-asunto'),modulo:g('p-modulo'),prioridad:g('p-prioridad'),fecha:g('p-fecha')||hoy(),estado:g('p-estado'),
      pedidoPor:g('p-pedido'),tecnico:g('p-tecnico'),casoTango:g('p-caso'),resueltoEl:g('p-resuelto'),detalle:g('p-detalle')};
  }
  function closePanel(){$('#panel-root').innerHTML='';openId=null;document.body.style.overflow=''}

  function submit(t){
    var f=readForm();
    if(!f.asunto){toast('Escribí un asunto para el soporte.');$('#p-asunto').focus();return}
    var nuevo=!!t._nuevo;
    var out=Object.assign({},t,f);delete out._nuevo;
    out.log=(t.log||[]).slice();
    var now=new Date().toISOString();
    if(nuevo){out.creado=now;out.log.push({t:now,tipo:'sys',txt:'Soporte cargado · '+est(out.estado).l})}
    else if(t.estado!==out.estado){out.log.push({t:now,tipo:'sys',txt:'Estado: '+est(t.estado).l+' → '+est(out.estado).l})}
    if(out.estado!=='resuelto'&&t.estado==='resuelto'&&f.resueltoEl===t.resueltoEl)out.resueltoEl='';
    save(out).then(function(){
      toast(nuevo?codigo(out)+' guardado':'Cambios guardados');
      if(nuevo){filt.est='abiertos';openPanel(out)}else closePanel();
    },function(){});
  }

  function nuevo(){
    var max=items.reduce(function(m,t){return Math.max(m,t.num||0)},0);
    openPanel({_nuevo:true,id:newId(),num:max+1,fecha:hoy(),modulo:MODULOS[0],prioridad:'media',estado:'enviado',asunto:'',detalle:'',pedidoPor:'',tecnico:'',casoTango:'',resueltoEl:'',log:[]});
  }
  function findItem(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return items[i];return null}

  function copy(txt){
    var done=function(){toast('Mensaje copiado. Pegalo en WhatsApp.')};
    var fallback=function(){var el=$('#wa-txt');var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto seleccionado: copialo con Ctrl+C')};
    try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
  }

  function csv(){
    var cols=['N°','Fecha pedido','Módulo','Asunto','Detalle','Prioridad','Estado','Pedido por','Técnico Tango','Caso Tango','Resuelto el','Días','Seguimiento'];
    var q=function(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'};
    var lines=[cols.map(q).join(';')];
    items.slice().sort(function(a,b){return (a.num||0)-(b.num||0)}).forEach(function(t){
      var cerr=ABIERTOS.indexOf(t.estado)<0;
      lines.push([codigo(t),fmtD(t.fecha),t.modulo,t.asunto,t.detalle,prio(t.prioridad).l,est(t.estado).l,t.pedidoPor,t.tecnico,t.casoTango,fmtD(t.resueltoEl),dias(t.fecha,cerr?(t.resueltoEl||t.fecha):null),(t.log||[]).map(function(l){return fmtDT(l.t)+' '+l.txt}).join(' | ')].map(q).join(';'));
    });
    var data='﻿'+lines.join('\r\n');
    downloads.save({filename:'soportes-tango-'+hoy()+'.csv',data:data}).then(function(){toast('CSV listo')},function(){});
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('button,[data-a="close"]');
    if(ev.target.id==='ov'){closePanel();return}
    if(!b)return;
    if(b.id==='btn-new'){nuevo();return}
    if(b.id==='btn-csv'){csv();return}
    if(b.dataset.stat){filt.est=b.dataset.stat;render();return}
    if(b.dataset.est){filt.est=b.dataset.est;render();return}
    if(b.classList.contains('row')){
      if(b.dataset.ej){toast('Es un ejemplo. Cargá tu primer soporte con “+ Nuevo soporte”.');return}
      var t=findItem(b.dataset.id);if(t)openPanel(t);return;
    }
    var a=b.dataset.a;
    if(a==='close'){closePanel();return}
    if(a==='copy'){copy($('#wa-txt').textContent);return}
    if(a==='del'){$('#del-slot').innerHTML='<span class="confirm">¿Borrar este soporte? <button type="button" class="btn danger sm" data-a="del-yes">Sí, borrar</button><button type="button" class="btn sm" data-a="del-no">No</button></span>';return}
    if(a==='del-no'){$('#del-slot').innerHTML='<button type="button" class="btn danger sm" data-a="del">Borrar</button>';return}
    if(a==='del-yes'){var id=openId;closePanel();remove(id).then(function(){toast('Soporte borrado')});return}
    if(a==='note'){
      var ta=$('#p-nota');var txt=ta.value.trim();if(!txt){ta.focus();return}
      var cur=findItem(openId);if(!cur)return;
      var upd=Object.assign({},cur);upd.log=(cur.log||[]).concat([{t:new Date().toISOString(),tipo:'nota',txt:txt}]);
      save(upd).then(function(){toast('Anotación agregada');openPanel(findItem(openId)||upd)},function(){});
    }
  });
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&openId)closePanel()});
  $('#q').addEventListener('input',function(){filt.q=this.value;if(filt.q&&filt.est==='abiertos')filt.est='todos';render()});
  $('#f-mod').innerHTML='<option value="">Todos los módulos</option>'+MODULOS.map(function(m){return '<option>'+esc(m)+'</option>'}).join('');
  $('#f-mod').addEventListener('change',function(){filt.mod=this.value;render()});

  /* ---------- arranque ---------- */
  render();
  var started=false;
  function useLocal(){
    if(started)return;started=true;mode='local';items=lsLoad();
    var n=$('#notice');n.hidden=false;n.textContent='No se pudo conectar con la base compartida. Lo que cargues ahora queda guardado solo en este navegador.';
    render();
  }
  var c=window.claude;
  if(!c||!c.use){useLocal();}
  else{
    c.use('downloads').then(function(d){downloads=d;render()},function(){});
    c.use('db').then(function(d){
      if(!d){useLocal();return}
      db=d;col=db.collection('soportes');started=true;mode='db';
      col.limit(1000).onSnapshot(function(snap){
        items=snap.docs.map(function(s){var x=s.data()||{};x.id=s.id;return x});
        render();
      },function(e){
        if(e&&(e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')){useLocalAfter()}
      });
    },function(){useLocal()});
    c.use('user').then(function(u){
      if(u&&u.can){Promise.resolve(u.can('data.write')).then(function(ok){if(ok===false)readOnly()})}
    },function(){});
  }
  function useLocalAfter(){started=false;useLocal()}
})();
</script>
