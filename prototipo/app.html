<title>Trento Entregas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --red:#D71F2B; --red-deep:#A3131D; --red-tint:#FBE9EA; --red-line:#F2C6C9;
  --ink:#231A1B; --muted:#6F6263; --line:#E7DEDE; --ground:#F4EFEF; --surface:#FFFFFF; --sunk:#FAF7F7;
  --ok:#1D8A56; --ok-tint:#E4F4EC; --warn:#B86F00; --warn-tint:#FCF1DC; --info:#2B5DA8; --info-tint:#E6EEF9;
  --shadow:0 18px 40px -20px rgba(90,20,25,.35);
  --nps-det:#D71F2B; --nps-pas:#B3A8A9; --nps-pas-strong:#8A7F80; --nps-pro:#2B6CC4;
  --wa-bg:#EFE7DE; --wa-in:#FFFFFF; --wa-out:#D9FDD3; --wa-head:#1F5C4F; --wa-link:#027EB5; --wa-sys:#FFF3C4;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
    --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
    --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
    --shadow:0 18px 40px -20px rgba(0,0,0,.7);
    --nps-det:#E8434D; --nps-pas:#6E6465; --nps-pas-strong:#7D7274; --nps-pro:#5B8FE0; --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#005C4B; --wa-head:#202C33; --wa-link:#53BDEB; --wa-sys:#182229;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
  --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
  --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  --nps-det:#E8434D; --nps-pas:#6E6465; --nps-pas-strong:#7D7274; --nps-pro:#5B8FE0; --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#005C4B; --wa-head:#202C33; --wa-link:#53BDEB; --wa-sys:#182229;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--red)}

/* ---------- shared bits ---------- */
.logo-chip{background:#fff;border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;flex:0 0 auto}
.logo-chip img{height:22px;display:block}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-info{background:var(--info-tint);color:var(--info)}
.p-bad{background:var(--red-tint);color:var(--red)}
.p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:var(--red);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--red-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.okb{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.sb{justify-content:space-between}
.small{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--ink);font-weight:400;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--red);width:18px;height:18px;flex:0 0 auto}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--red)}
.progress.over i{background:var(--warn)}
.note{border-radius:8px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-tint);color:var(--ink)}
.note.info{background:var(--info-tint);color:var(--ink)}
.note.ok{background:var(--ok-tint);color:var(--ink)}
.note b{display:block;margin-bottom:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;font-size:30px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--red)}
.stars-ro{color:var(--red);letter-spacing:1px}

/* guide strip */
.guide{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--surface);padding:8px 16px;font-size:13px}
.guide b{color:var(--surface)}
.guide .tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--red);color:#fff;padding:2px 6px;border-radius:4px}
.guide .txt{flex:1;min-width:180px}
.guide button{background:var(--surface);color:var(--ink);border:0;border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px}
.guide button.x{background:none;color:var(--surface);opacity:.7;padding:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:78px 14px 1fr;gap:8px;font-size:13px;padding-bottom:12px;position:relative}
.tl time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:3px;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:91px;top:15px;bottom:0;width:2px;background:var(--line)}
.tl li.warn .d{background:var(--warn)}
.tl li.bad .d{background:var(--red)}
.tl li:last-child .d{box-shadow:0 0 0 4px var(--red-tint)}
.tl small{color:var(--muted);display:block}

/* proof of delivery */
.pod{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pod figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pod img,.pod .ph{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.pod .ph{display:grid;place-items:center;color:#8a7d7e;font-size:11px;font-weight:700;background:repeating-linear-gradient(135deg,#eee6e6 0 8px,#f8f4f4 8px 16px)}
.pod .sigimg{object-fit:contain}
.pod figcaption{font-size:11px;color:var(--muted)}

/* ---------- home ---------- */
.home{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:40px 60px;display:flex;flex-direction:column;gap:28px}
.home-head{display:flex;flex-direction:column;gap:14px}
.home-head img{height:46px;align-self:flex-start;background:#fff;border-radius:6px;padding:4px}
.home-head h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.025em;line-height:1.05;max-width:18ch}
.home-head p{color:var(--muted);max-width:60ch;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.roles{grid-template-columns:1fr}}
.role-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--ink);transition:transform .15s,box-shadow .15s}
.role-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--red-line)}
.role-card .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center}
.role-card .ic svg{width:24px;height:24px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rc-coord .ic{background:var(--red)}.rc-coord .ic svg{stroke:#fff}
.rc-chofer .ic{background:var(--ink)}.rc-chofer .ic svg{stroke:var(--surface)}
.rc-cliente .ic{box-shadow:inset 0 0 0 2px var(--red)}.rc-cliente .ic svg{stroke:var(--red)}
.role-card h2{font-size:20px}
.role-card p{color:var(--muted);font-size:13px}
.role-card .go{margin-top:auto;font-weight:700;color:var(--red);font-size:13px}
.home-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.status-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- coordinator ---------- */
.c-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--red);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
.c-top .ttl{font-weight:700;font-size:15px}
.c-top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
.c-top .out{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 auto}
.c-body{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 48px)}
.c-side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.c-side button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.c-side button:hover{background:var(--sunk);color:var(--ink)}
.c-side button[aria-current="page"]{background:var(--red-tint);color:var(--red);font-weight:700}
.c-side .cnt{font-size:11px;font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.c-main{padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px;max-width:1160px;width:100%;min-width:0}
.c-main h1{font-size:24px;letter-spacing:-.02em}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--red);font-weight:700;font-size:12px}
@media (max-width:760px){
  .c-body{grid-template-columns:minmax(0,1fr)}
  .c-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}
  .c-main{padding-inline:16px}
  .c-top .who .nm{display:none}
}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.kpi.hot b{color:var(--red)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
tr.grp td{background:var(--sunk);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:default;padding:7px 10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.w{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:860px){.grid2,.grid2.w{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.slotgrid .chip{border-radius:8px;text-align:left;padding:9px 10px}

/* routes */
.stops{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.stop .n.done{background:var(--ok)}
.stop .n.fail{background:var(--muted)}
.stop .n.depot{background:var(--ink);color:var(--surface)}
.stop b{display:block;font-size:13px}
.stop small{color:var(--muted);font-size:12px;display:block}
.stop .eta{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.stop .ord{display:flex;gap:4px}
.ib{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--ink);display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35}
.map{background:var(--sunk);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.st{stroke:var(--line);stroke-width:7;fill:none}
.st2{stroke:var(--line);stroke-width:3;fill:none}
.rt{stroke:var(--red);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pin{fill:var(--red)}
.pin.done{fill:var(--ok)}
.pin-d{fill:var(--ink)}
.pin-t{fill:#fff;font:700 11px Arial, sans-serif}
.pin-t2{fill:var(--surface);font:700 11px Arial, sans-serif}
.map-lbl{fill:var(--muted);font:700 9px Arial, sans-serif}
.truck{fill:var(--info)}
.rcard{display:flex;flex-direction:column;gap:10px}
.rcard-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.rcard-h b{font-size:15px}
.minis{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- mobile apps (chofer / cliente) ---------- */
.m-shell{max-width:440px;margin:0 auto;min-height:100vh;background:var(--sunk);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.m-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px}
.m-top .ttl{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-top .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;width:34px;height:34px;font-size:18px;font-weight:700;flex:0 0 auto}
.m-top .out{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px}
.m-top .mark{width:30px;height:30px;border-radius:6px;overflow:hidden;background:#fff;flex:0 0 auto}
.m-top .mark img{height:30px;max-width:none;display:block}
.m-content{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.m-foot{position:sticky;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.hl{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.card.tap{text-align:left;color:var(--ink);width:100%}
.card.tap:hover{border-color:var(--red-line)}
.m-title{font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.015em}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.act svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.done{background:var(--ok-tint);border-color:var(--ok)}
.act.done svg{stroke:var(--ok)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.counter .ib{width:42px;height:42px;font-size:20px}
.photo-box{height:150px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;position:relative}
.photo-box img{width:100%;height:100%;object-fit:cover}
.sigwrap{position:relative}
canvas.sig{display:block;width:100%;height:130px;border-radius:10px;border:1.5px dashed var(--line);background:#fff;touch-action:none}
.sigwrap .hint{position:absolute;left:12px;bottom:8px;font-size:11px;color:#9a8d8e;pointer-events:none}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);text-align:left;color:var(--ink);width:100%}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-tint)}
.opt[aria-pressed="true"] .dot{border:5px solid var(--red)}
.opt b{display:block;font-size:14px}
.opt small{font-size:12px;color:var(--muted)}
.wa{background:var(--ok-tint);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.bubble{background:var(--surface);border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.otp{font-size:26px;letter-spacing:.5em;text-align:center;font-weight:700;padding:12px}
.err{color:var(--red);font-size:13px;font-weight:700}
.login-red{background:var(--red);color:#fff;flex:1;display:flex;flex-direction:column}
.login-red label.f{color:#fff}
.login-red .btn.inv{background:#fff;color:#A3131D}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.track{display:flex;flex-direction:column;gap:6px}
.track-bar{display:flex;gap:4px}
.track-bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.track-bar i.done{background:var(--ok)}
.track-bar i.me{background:var(--red)}

/* coordinator login */
.c-login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}

             a:{mid:['El chofer apurado, no esperó a que controlemos.','No ayudó a acomodar la carga.'],bad:['El chofer no quiso ayudar a bajar la carga.','Trato poco amable con nuestro personal.']}};
  const good=['Todo perfecto, como siempre.','El aviso de 15 minutos nos organiza mucho.','Muy amable el chofer.','Llegó dentro del rango y bien embalado.'];
  const days=[['11/08','12/08','13/08','14/08','15/08'],['18/08','19/08','20/08','21/08','22/08'],['25/08','26/08','27/08','28/08','29/08'],['01/09','02/09','03/09','04/09','05/09'],['08/09','09/09','10/09','11/09','12/09'],['15/09','16/09','17/09','18/09','19/09'],['22/09','23/09']];
  const out=[];let id=0;
  ENC_WEEKS.forEach((w,wi)=>{
    const k=wi===6?6:17+Math.floor(r()*5);
    for(let i=0;i<k;i++){
      const z=pick(ZN_ORDER),ch=r()<.5?'Milena Rozo':'Eugenia';
      const base={p:.72+wi*.025,m:.86,a:.88};
      const lv=key=>{const pOk=base[key]+(zAdj[z][key]||0)+((dAdj[ch]||{})[key]||0);const u=r();return u<pOk?'ok':u<pOk+(1-pOk)*.65?'mid':'bad';};
      const x={id:'E'+(++id),cliente:pick(cli[z]),zona:z,chofer:ch,p:lv('p'),m:lv('m'),a:lv('a'),comentario:'',d:pick(days[wi]),w:wi};
      const worst=ENC.find(e=>x[e.k]==='bad')||ENC.find(e=>x[e.k]==='mid');
      x.comentario=worst?(r()<.8?pick(com[worst.k][x[worst.k]]):''):(r()<.25?pick(good):'');
      x.followed=!(ENC.some(e=>x[e.k]==='bad')&&wi>=5);
      out.push(x);
    }
  });
  return out;
}
function askSurvey(o){o.encAsk=true;o.enc={};encNext(o);}
function encNext(o){
  const e=ENC.find(q=>!o.enc[q.k]);
  if(e){notify('cliente',(e.n===1?'Nos ayudás a mejorar? 3 preguntas cortas · ':'')+e.n+'/3 '+e.icon,e.q,o.id,'q'+e.k);return;}
  o.enc.done=true;encCommit(o);
  if(ENC.some(q=>o.enc[q.k]!=='ok')){o.encAwait=true;notify('cliente','Gracias por contarnos 🙏','¿Qué deberíamos cambiar para la próxima? Escribilo en un mensaje: lo lee directamente coordinación.',o.id,'qcom');}
  else notify('cliente','¡Gracias! 🙌','Nos alegra que todo haya salido bien. ¡Hasta la próxima entrega!',o.id,'gracias');
}
function encCommit(o){
  const x={id:'E'+(S.encHist.length+1),oid:o.id,cliente:o.cliente,zona:zoneOf(o),chofer:o.entrega?o.entrega.chofer:'—',p:o.enc.p,m:o.enc.m,a:o.enc.a,comentario:o.enc.comentario||'',d:now().d,w:6};
  const bad=ENC.filter(e=>x[e.k]==='bad');x.followed=!bad.length;
  S.encHist.push(x);
  const probs=ENC.filter(e=>x[e.k]!=='ok');
  log(o,'Encuesta de calidad: '+(probs.length?probs.length+' punto'+(probs.length>1?'s':'')+' a mejorar':'entrega perfecta'),ENC.map(e=>e.area+': '+e.opts[x[e.k]]).join(' · '),bad.length?'bad':probs.length?'warn':'');
  if(bad.length)notify('coord','⚠️ Problema en entrega: '+o.cliente,bad.map(e=>e.area+' — '+e.opts[x[e.k]]).join(' · ')+'. Contactalo desde Calidad.',o.id);
}
function encUpdateComment(o){const h=S.encHist.find(x=>x.oid===o.id);if(h)h.comentario=o.enc.comentario;}

/* ---------- tablero de Calidad ---------- */
function cCalidad(){
  const all=S.encHist;const zsel=ui.qz&&ui.qz!=='todas'?ui.qz:null;const f=zsel?all.filter(x=>x.zona===zsel):all;
  const k=encCalc(f);
  const zchips='<div class="chips">'+[['todas','Todas las zonas']].concat(ZN_ORDER.map(z=>[z,ZN[z]])).map(z=>'<button type="button" class="chip" data-a="setQz" data-z="'+z[0]+'" aria-pressed="'+((ui.qz||'todas')===z[0])+'">'+z[1]+'</button>').join('')+'</div>';
  const hero='<div class="panel"><span class="lbl">Entrega perfecta · últimas 7 semanas'+(zsel?' · '+ZN[zsel]:'')+'</span>'+
    '<div class="nps-top"><div class="nps-num">'+k.perf+'%</div><div class="small">de las entregas salieron bien en las 3 preguntas<br>'+k.n+' respuestas · Meta: '+ENC_GOAL+'% · '+(k.perf>=ENC_GOAL?'<b style="color:var(--ok)">✓ cumplida</b>':'<b style="color:var(--warn)">faltan '+(ENC_GOAL-k.perf)+' pts</b>')+'</div></div>'+
    '<p class="small">Entrega perfecta = llegó a tiempo, completa y en buen estado, y con muy buena atención. Es el indicador que resume la calidad y el que conviene seguir semana a semana.</p></div>';
  const tile=e=>{const c=k[e.k];return '<div class="panel qtile"><div class="row sb"><span class="lbl">'+e.icon+' '+e.n+'. '+e.area+'</span><span class="small">Resp.: '+e.owner+'</span></div>'+
    '<p class="small" style="margin-top:-4px">“'+e.q+'”</p>'+
    '<div class="meter-big"><b>'+c.pct+'%</b><span class="small">'+e.okTxt+'</span><span class="pill '+lvPill(c.pct)+'" style="margin-left:auto">'+(c.pct>=ENC_GOAL?'En meta':c.pct>=70?'A mejorar':'Crítico')+'</span></div>'+
    '<div class="nps-stack" role="img" aria-label="'+e.area+': '+['ok','mid','bad'].map(v=>e.opts[v]+' '+pc(c[v],k.n)+'%').join(', ')+'">'+['ok','mid','bad'].filter(v=>c[v]).map(v=>'<i class="'+{ok:'pro',mid:'pas',bad:'det'}[v]+'" style="flex:'+c[v]+'" tabindex="0" data-tip="'+esc(e.opts[v])+': '+c[v]+' ('+pc(c[v],k.n)+'%)"></i>').join('')+'</div>'+
    '<div class="nps-leg">'+['ok','mid','bad'].map(v=>'<span><i class="sw '+{ok:'pro',mid:'pas',bad:'det'}[v]+'"></i>'+esc(e.opts[v])+' <b>'+pc(c[v],k.n)+'%</b></span>').join('')+'</div></div>';};
  /* weekly trend of perfect deliveries */
  const wk=ENC_WEEKS.map((w,i)=>{const l=f.filter(x=>x.w===i);return {w,n:l.length,v:encCalc(l).perf};});
  const W=900,H=240,pl=40,pr=20,pt=16,pb=28,lo=Math.min(50,Math.floor(Math.min(...wk.filter(p=>p.n).map(p=>p.v))/10)*10),hi=100;
  const X=i=>pl+i*(W-pl-pr)/(wk.length-1),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const ticks=[];for(let t=lo;t<=hi;t+=10)ticks.push(t);
  const pts=wk.map((p,i)=>p.n?[X(i),Y(p.v),p]:null).filter(Boolean);
  const line='<div class="panel"><span class="lbl">Entrega perfecta por semana</span><div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" class="trend" role="img" aria-label="Porcentaje de entregas perfectas por semana">'+
    ticks.map(t=>'<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="ax" x="'+(pl-6)+'" y="'+(Y(t)+3)+'" text-anchor="end">'+t+'%</text>').join('')+
    '<line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(ENC_GOAL)+'" y2="'+Y(ENC_GOAL)+'"/><text class="goal-t" x="'+(pl+6)+'" y="'+(Y(ENC_GOAL)-6)+'">Meta '+ENC_GOAL+'%</text>'+
    wk.map((p,i)=>'<text class="ax" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="'+(i===wk.length-1?'end':i===0?'start':'middle')+'">'+p.w+'</text>').join('')+
    (pts.length>1?'<path class="tl-area" d="M'+pts.map(q=>q[0]+' '+q[1]).join(' L')+' L'+pts[pts.length-1][0]+' '+Y(lo)+' L'+pts[0][0]+' '+Y(lo)+' Z"/><path class="tl-line" d="M'+pts.map(q=>q[0]+' '+q[1]).join(' L')+'"/>':'')+
    pts.map((q,j)=>'<g tabindex="0" data-tip="Semana '+q[2].w+': '+q[2].v+'% perfectas · '+q[2].n+' respuestas"><circle class="hit" cx="'+q[0]+'" cy="'+q[1]+'" r="14"/><circle class="pt'+(j===pts.length-1?' last':'')+'" cx="'+q[0]+'" cy="'+q[1]+'" r="'+(j===pts.length-1?5:4)+'"/></g>').join('')+
    (pts.length?'<text class="lbl-last" x="'+(pts[pts.length-1][0]-10)+'" y="'+(pts[pts.length-1][1]-10)+'" text-anchor="end">'+pts[pts.length-1][2].v+'%</text>':'')+
  '</svg></div><p class="small">Pasá el mouse por los puntos para ver cada semana. “Esta semana” es parcial e incluye las respuestas de la demo.</p></div>';
  /* focus: where to improve */
  const focus=ENC.map(e=>({e,prob:100-k[e.k].pct,mid:pc(k[e.k].mid,k.n),bad:pc(k[e.k].bad,k.n)})).sort((a,b)=>b.prob-a.prob);
  const mx=Math.max(1,...focus.map(x=>x.prob));
  const foco='<div class="panel"><span class="lbl">Dónde hacer foco</span><p class="small">% de entregas con problema en cada área'+(zsel?' en '+ZN[zsel]:'')+', de mayor a menor.</p><div class="hb">'+
    focus.map(x=>'<div class="hrow"><span>'+x.e.icon+' '+x.e.area+'</span><span class="htrack"><i class="bad" style="width:'+Math.round(x.prob/mx*100)+'%" tabindex="0" data-tip="'+x.e.area+': '+x.prob+'% con problema ('+esc(x.e.opts.mid)+' '+x.mid+'% · '+esc(x.e.opts.bad)+' '+x.bad+'%)"></i></span><b>'+x.prob+'%</b></div>').join('')+'</div>'+
    '<div class="note warn"><b>Prioridad 1: '+focus[0].e.area+' · responsable '+focus[0].e.owner+'</b>'+focus[0].prob+'% de las entregas con problema ('+esc(focus[0].e.opts.mid)+' '+focus[0].mid+'%, '+esc(focus[0].e.opts.bad)+' '+focus[0].bad+'%). Acción sugerida: '+focus[0].e.act+'</div>'+
    '<div class="note info"><b>Prioridad 2: '+focus[1].e.area+' · '+focus[1].e.owner+'</b>'+focus[1].e.act+'</div></div>';
  /* matrix by zone / driver */
  const matrix=(rows,sel,title,foot)=>'<div class="panel"><span class="lbl">'+title+'</span><div class="tbl-wrap flat"><table class="qm"><thead><tr><th></th>'+ENC.map(e=>'<th>'+e.icon+' '+e.area+'</th>').join('')+'<th>Entrega perfecta</th></tr></thead><tbody>'+
    rows.map(g=>{const c=encCalc(g.l);return '<tr'+(g.key?' data-a="setQz" data-z="'+g.key+'" tabindex="0"':'')+(sel&&sel===g.key?' class="on"':'')+'><td><b>'+esc(g.name)+'</b><small>'+c.n+' resp.</small></td>'+ENC.map(e=>'<td><span class="pill '+lvPill(c[e.k].pct)+'">'+c[e.k].pct+'%</span></td>').join('')+'<td><div class="pbar"><span class="htrack"><i class="good" style="width:'+c.perf+'%"></i></span><b>'+c.perf+'%</b></div></td></tr>';}).join('')+
    '</tbody></table></div>'+(foot?'<p class="small">'+foot+'</p>':'')+'</div>';
  const byZone=matrix(ZN_ORDER.map(z=>({key:z,name:ZN[z],l:all.filter(x=>x.zona===z)})),zsel,'Por zona','Verde: en meta (≥'+ENC_GOAL+'%) · Amarillo: 70–84% · Rojo: menos de 70%. Tocá una zona para filtrar.');
  const byDrv=matrix(DRIVERS.map(d=>({name:d.nombre,l:f.filter(x=>x.chofer===d.nombre)})),null,'Por chofer','');
  /* follow-ups & comments */
  const pend=all.filter(x=>!x.followed).sort((a,b)=>b.w-a.w);
  const casos='<div class="panel"><div class="row sb"><span class="lbl">Clientes a contactar</span><span class="pill '+(pend.length?'p-bad':'p-ok')+'">'+(pend.length?pend.length+' pendientes':'Al día')+'</span></div>'+
    '<p class="small">Toda respuesta “Muy tarde”, “Llegó dañada” o “Mala” abre un caso.</p>'+
    (pend.length?pend.map(x=>'<div class="case"><div class="row sb"><b>'+esc(x.cliente)+'</b><span class="small">'+x.d+' · '+ZN[x.zona]+'</span></div><div class="ansrow">'+encChips(x)+'</div><span class="small">Chofer '+esc(x.chofer)+'</span>'+(x.comentario?'<q>'+esc(x.comentario)+'</q>':'')+'<div class="row end"><button type="button" class="btn ghost sm" data-a="encFollow" data-id="'+x.id+'">Marcar como contactado</button></div></div>').join(''):'<div class="small">No hay casos pendientes. 👏</div>')+
    '<p class="small">Regla sugerida: contactar dentro de las 48 h y registrar la acción.</p></div>';
  const coms=f.filter(x=>x.comentario).slice(-6).reverse();
  const comentarios='<div class="panel"><span class="lbl">Qué nos dicen los clientes</span>'+coms.map(x=>'<div class="cm"><div class="ansrow">'+encChips(x)+'</div><q>'+esc(x.comentario)+'</q><span class="small">'+esc(x.cliente)+' · '+ZN[x.zona]+' · '+x.d+'</span></div>').join('')+'</div>';
  return '<div class="row sb"><div><div class="crumbs">Encuesta post-entrega · 3 preguntas</div><h1>Calidad de entrega</h1></div>'+zchips+'</div>'+

    '<div class="qtiles">'+ENC.map(tile).join('')+'</div>'+line+
    byZone+byDrv+

/* botones de cada mensaje: respuestas rápidas (se contestan dentro de WhatsApp, sin código) y link a la web (pide código la primera vez) */
function waBtns(n,live){
  const o=n.oid&&ord(n.oid);if(!o)return '';
  let q=[],cta=null;
  if(n.act==='elegir'){if(o.estado==='esperando_cliente')q=o.turnos.map(t=>['waSlot',t.split(' · ')[0]+' · '+t.split(' · ')[1],t]);cta='Ver opciones en la web';}
  else if(n.act==='salio'||n.act==='15')cta='Seguir mi envío';
  else if(n.act==='entregado'){if(o.estado==='entregado')q=[['waOk','✅ Todo conforme',''],['waObs','⚠️ Tengo una observación','']];cta='Ver comprobante';}
  else if(['conf','reclamo','fallo','msg'].includes(n.act))cta='Ver mi pedido';
  else if(/^q[pma]$/.test(n.act)){
    const e=ENC.find(x=>'q'+x.k===n.act);const on=live&&o.enc&&!o.enc[e.k];
    return '<div class="wa-btns">'+['ok','mid','bad'].map(v=>on?'<button type="button" class="wa-qr" data-a="waQ" data-id="'+o.id+'" data-q="'+e.k+'" data-v="'+v+'">'+esc(e.opts[v])+'</button>':'<span class="wa-qr ro">'+esc(e.opts[v])+'</span>').join('')+'</div>';
  }
  if(!q.length&&!cta)return '';
  if(!live)return '<div class="wa-btns">'+q.map(x=>'<span class="wa-qr ro">'+esc(x[1])+'</span>').join('')+(cta?'<span class="wa-cta ro">🔗 '+cta+'</span>':'')+'</div>';
  return '<div class="wa-btns">'+q.map(x=>'<button type="button" class="wa-qr" data-a="'+x[0]+'" data-id="'+o.id+'" data-v="'+esc(x[2])+'">'+esc(x[1])+'</button>').join('')+
    (cta?'<button type="button" class="wa-cta" data-a="waOpen" data-id="'+o.id+'">🔗 '+cta+'</button>':'')+'</div>';
}
function waThread(list,live){
  let lastD='';
  return list.map(n=>{

function load_(stops){return {kg:stops.reduce((a,id)=>a+ord(id).kg,0),m3:stops.reduce((a,id)=>a+ord(id).m3,0)};}
function fillPct(stops,tk){const t=TRUCKS[tk],l=load_(stops);return Math.max(Math.round(l.kg/t.kg*100),Math.round(l.m3/t.m3*100));}
function capHTML(stops,tk){
  const t=TRUCKS[tk];const l=load_(stops);
  const pk=Math.round(l.kg/t.kg*100),pm=Math.round(l.m3/t.m3*100),top=Math.max(pk,pm);
  let msg;
  if(pk>100||pm>100)msg='<div class="note warn"><b>Supera la capacidad</b>Quitá un pedido o elegí un camión más grande.</div>';
  else if(stops.length>=MAX_STOPS)msg='<div class="note ok"><b>Cupo completo: 5 clientes</b>Es el máximo por día. Los pedidos restantes pasan al próximo día hábil.</div>';
  else if(top>=80)msg='<div class="note ok"><b>Camión bien aprovechado</b>Carga al '+top+'%.</div>';
  else msg='<div class="note info"><b>Queda espacio en el camión</b>Carga al '+top+'%. Sumá pedidos de la zona para salir a tope (quedan '+(MAX_STOPS-stops.length)+' clientes disponibles).</div>';
  return '<span class="lbl">Carga de '+t.pat+'</span>'+
    '<div class="meter-big"><b>'+top+'%</b><span class="small">de ocupación</span></div>'+
    '<div class="row sb"><span>Peso '+kgf(l.kg)+' / '+kgf(t.kg)+' kg</span><b>'+pk+'%</b></div><div class="progress'+(pk>100?' over':'')+'"><i style="width:'+Math.min(pk,100)+'%"></i></div>'+
    '<div class="row sb"><span>Volumen '+m3f(l.m3)+' / '+t.m3+' m³</span><b>'+pm+'%</b></div><div class="progress'+(pm>100?' over':'')+'"><i style="width:'+Math.min(pm,100)+'%"></i></div>'+

/* completa el camión: mantiene lo elegido y suma la combinación de pedidos de la zona que más carga aprovecha sin pasar capacidad ni 5 clientes */
function autoFill(d){
  const t=TRUCKS[d.camion];
  const pool=S.orders.filter(o=>o.estado==='confirmado'&&zoneOf(o)===d.zona&&!d.stops.includes(o.id));
  const base=load_(d.stops);const room=MAX_STOPS-d.stops.length;
  let best=[],bestScore=-1;
  const n=pool.length;
  for(let mask=0;mask<(1<<n);mask++){
    const pick=pool.filter((_,i)=>mask&(1<<i));
    if(pick.length>room)continue;
    const kg=base.kg+pick.reduce((a,o)=>a+o.kg,0),m3=base.m3+pick.reduce((a,o)=>a+o.m3,0);
    if(kg>t.kg||m3>t.m3)continue;
    const score=Math.max(kg/t.kg,m3/t.m3)*1000+pick.length;
    if(score>bestScore){bestScore=score;best=pick;}
  }
  d.stops=d.stops.concat(best.map(o=>o.id));
  sortByFranja(d.stops);
  return best.length;
}

let sigDirty=false;
function initSig(){
  const c=$('#sig');if(!c)return;
  const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
  c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#231A1B';
  sigDirty=false;
  if(ui.stop&&ui.stop.firma){const im=new Image();im.onload=()=>{x.drawImage(im,0,0,r.width,r.height);};im.src=ui.stop.firma;sigDirty=true;$('#sighint').hidden=true;}
  let dn=false,lx=0,ly=0;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener('pointerdown',e=>{dn=true;try{c.setPointerCapture(e.pointerId);}catch(_){}[lx,ly]=pos(e);x.beginPath();x.arc(lx,ly,1.1,0,Math.PI*2);x.fillStyle='#231A1B';x.fill();sigDirty=true;$('#sighint').hidden=true;});
  c.addEventListener('pointermove',e=>{if(!dn)return;const [nx,ny]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(nx,ny);x.stroke();lx=nx;ly=ny;});
  const up=()=>{if(dn){dn=false;if(ui.stop)ui.stop.firma=c.toDataURL('image/png');}};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',up);
}

  return c.toDataURL('image/jpeg',.75);
}
function readPhoto(file,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72));};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result;};r.readAsDataURL(file);
}

    log(o,'Cliente confirmó por WhatsApp: '+t,'Respuesta con botón · recibe '+o.recibe);
    notify('coord','Turno confirmado: '+o.cliente,o.id+' · '+t+' · '+ZN[zoneOf(o)]+' (respondió por WhatsApp). Ya podés sumarlo a la hoja de ruta.',o.id);
    notify('cliente','¡Listo! Entrega confirmada','Te esperamos el '+t.replace(' · ',' entre las ').replace('–',' y ')+'. El día de la entrega, cuando salga el camión, te avisamos con un rango horario.',o.id,'conf');
    render();
  },
  waOk(el){
    const o=ord(el.dataset.id);if(o.estado!=='entregado')return;
    waOut(o.id,'✅ Todo conforme');o.respuesta={tipo:'conforme',detalle:'',foto:null};o.estado='cerrado';
    log(o,'Cliente: todo conforme','Respondió por WhatsApp');log(o,'Pedido cerrado','');
    notify('coord','Recepción conforme: '+o.cliente,o.id+' · respondió por WhatsApp',o.id);
    notify('cliente','¡Gracias por tu respuesta!','Registramos tu conformidad para '+o.id+'.',o.id,'gracias');
    askSurvey(o);
    render();
  },
  waObs(el){waOut(el.dataset.id,'⚠️ Tengo una observación');A.waOpen(el);},
  /* client */
  kOpen(el){ui.bell=false;ui.kView='pedido';ui.kOrder=el.dataset.id;ui.kStars=5;ui.kFoto=null;render();window.scrollTo(0,0);},
  kBack(){ui.kView='lista';render();},
  kOther(){const c=$('#kother');c.hidden=!c.hidden;},
  kAskOther(el){
    const o=ord(el.dataset.id);const n=$('#k-nota').value.trim();if(!n){toast('Contanos qué día te sirve');return;}
    o.nota=n;o.estado='reprogramar';o.turnos=[];o.turno=null;
    if(o.ruta){const r=ruta(o.ruta);if(r&&r.estado==='publicada')r.stops=r.stops.filter(x=>x!==o.id);o.ruta=null;}
    log(o,'Cliente pidió otra fecha','“'+n+'”','warn');
    notify('coord','Reprogramación pedida: '+o.cliente,o.id+' · “'+n+'”',o.id);render();toast('Enviamos tu pedido a coordinación');
  },
  kConfirm(el){
    const o=ord(el.dataset.id);const b=$('[data-group="kslot"] [aria-pressed="true"]');
    o.turno=b.dataset.v;o.recibe=$('#k-rec').value.trim();o.acceso=$('#k-acc').value.trim();o.estado='confirmado';
    log(o,'Cliente confirmó '+o.turno,'Recibe '+o.recibe);
    notify('coord','Turno confirmado: '+o.cliente,o.id+' · '+o.turno+' · '+ZN[zoneOf(o)]+'. Ya podés sumarlo a la hoja de ruta.',o.id);render();toast('¡Listo! Tu entrega quedó confirmada');
  },
  star(el){ui.kStars=+el.dataset.n;$$('#stars button').forEach(b=>b.classList.toggle('on',+b.dataset.n<=ui.kStars));},
  kRespond(el){
    const o=ord(el.dataset.id);const t=$('[data-group="resp"] [aria-pressed="true"]').dataset.v;const det=$('#k-det').value.trim();
    const e=$('#k-err');
    if(t!=='conforme'&&!det){e.textContent='Contanos qué pasó en el comentario.';e.hidden=false;return;}
    const ans={};ENC.forEach(q=>{const b=$('[data-group="enc-'+q.k+'"] [aria-pressed="true"]');if(b)ans[q.k]=b.dataset.v;});
    if(Object.keys(ans).length<3){e.textContent='Respondé las 3 preguntas cortas.';e.hidden=false;return;}
    o.respuesta={tipo:t,detalle:det,foto:ui.kFoto||null};
    o.encAsk=true;o.enc=Object.assign(ans,{done:true,comentario:$('#k-encc').value.trim()});
    const st=ENC.filter(q=>ans[q.k]!=='ok').map(q=>q.area).join(', ')||'entrega perfecta';
    if(t==='conforme'){o.estado='cerrado';log(o,'Cliente: todo conforme',st);log(o,'Pedido cerrado','');notify('coord','Recepción conforme: '+o.cliente,o.id+' · '+st,o.id);toast('¡Gracias por tu respuesta!');}
    else{S.seq.rec++;o.reclamo='R-'+S.seq.rec;o.estado='con_obs';log(o,'Cliente: '+(t==='obs'?'con observaciones':'rechazo parcial'),'“'+det+'” · '+st,'bad');log(o,'Reclamo '+o.reclamo+' abierto','Asignado a coordinación','bad');notify('coord','Reclamo '+o.reclamo+': '+o.cliente,'“'+det+'” · '+st,o.id);toast('Recibimos tu observación · reclamo '+o.reclamo);}
    encCommit(o);
    ui.kFoto=null;render();window.scrollTo(0,0);
  },
  setQz(el){ui.qz=el.dataset.z===ui.qz?'todas':el.dataset.z;render();},
  encFollow(el){const h=S.encHist.find(x=>x.id===el.dataset.id);if(h){h.followed=true;if(h.oid){const o=ord(h.oid);if(o)log(o,'Cliente contactado por calidad','Milena Rozo · Coordinación');}}render();toast('Marcado como contactado');},
  waQ(el){
    const o=ord(el.dataset.id);const q=el.dataset.q,v=el.dataset.v;if(!o.enc||o.enc[q])return;
    const e=ENC.find(x=>x.k===q);o.enc[q]=v;waOut(o.id,e.opts[v]);encNext(o);render();
  }
};
function updBul(o){$('#bul').textContent=ui.stop.bultos;$('#bulbar').style.width=Math.round(ui.stop.bultos/o.bultos*100)+'%';save();}
function finishCheck(o){const r=ruta(o.ruta);if(r&&r.stops.every(id=>ord(id).estado!=='en_ruta')){r.estado='finalizada';const ok=r.stops.filter(id=>ord(id).estado!=='no_entregado').length;notify('coord','🏁 '+r.id+' finalizada',ok+' de '+r.stops.length+' entregas realizadas · '+drv(r.chofer).nombre+' vuelve al depósito.');}}

/* forms */
const F={
  loginCoord(){ui.screen='coord';ui.view='panel';render();toast('Hola, Milena Rozo');},
  loginChofer(){
    const dni=$('#ld-dni').value.replace(/\D/g,'');const d=DRIVERS.find(x=>x.dni===dni);const e=$('#ld-err');
    if(!d){e.textContent='No encontramos ese DNI. Probá con Milena Rozo o Eugenia.';e.hidden=false;return;}
    if($('#ld-pin').value.length!==4){e.textContent='El PIN tiene 4 dígitos.';e.hidden=false;return;}
    ui.driver=d.id;ui.screen='chofer';ui.view='ruta';ui.stop=null;render();toast('Hola, '+d.nombre);
  },
  loginCliente(){
    const v=$('#lk-otp').value.replace(/\D/g,'');const e=$('#lk-err');
    if(v.length!==6){e.textContent='El código tiene 6 dígitos.';e.hidden=false;return;}
    ui.kVerified=true;ui.screen='cliente';
    if(ui.pend&&ord(ui.pend)){ui.kView='pedido';ui.kOrder=ui.pend;ui.kStars=5;}else ui.kView='lista';
    ui.pend=null;render();toast('Hola, Milena Rozo');
  },
  waSend(){
    const t=$('#wa-in').value.trim();if(!t)return;
    const o=ord(HERO);
    const aw=S.orders.find(x=>x.cli==='fds'&&x.encAwait);
    if(aw){waOut(aw.id,t);aw.enc.comentario=t;aw.encAwait=false;encUpdateComment(aw);log(aw,'Comentario de calidad','“'+t+'”');
      notify('cliente','¡Gracias por ayudarnos a mejorar! 🙏','Tu opinión llega directo al equipo de coordinación.',aw.id,'gracias');
      notify('coord','💬 Qué mejorar según '+aw.cliente,'“'+t+'” · '+ENC.filter(q=>aw.enc[q.k]!=='ok').map(q=>q.area).join(', '),aw.id);
      render();return;}
    waOut(null,t);
    notify('coord','💬 WhatsApp de '+o.cliente,'“'+t+'”',o.id);
    notify('cliente','Trento Logística','Recibimos tu mensaje. Milena Rozo de coordinación te responde en breve.',null,'auto');
    render();
  }
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t&&!t.disabled){
    const g=t.closest('[data-group]');
    if(t.dataset.t==='single'){g.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed','false'));t.setAttribute('aria-pressed','true');}
    else t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')==='true'?'false':'true');
    return;
  }
  const a=e.target.closest('[data-a]');
  if(a&&A[a.dataset.a]&&!a.disabled){if(a.tagName==='A')return;e.preventDefault();A[a.dataset.a](a);}
});
function showTip(el,x,y){const t=$('#tip');t.textContent=el.dataset.tip;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;t.style.left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2))+'px';t.style.top=Math.max(8,y-h-12)+'px';}
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else $('#tip').hidden=true;});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const b=el.getBoundingClientRect();showTip(el,b.left+b.width/2,b.top);}});
document.addEventListener('focusout',()=>{$('#tip').hidden=true;});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-a],.drow[data-a]')){A[e.target.dataset.a](e.target);}
});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(f&&F[f]){e.preventDefault();F[f]();}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='dr-camion'){ui.draft.camion=+e.target.value;render();}
  else if(id==='dr-chofer'){ui.draft.chofer=e.target.value;save();}
  else if(id==='ph-in'&&e.target.files[0]){readPhoto(e.target.files[0],u=>{ui.stop.foto=u;$('#phbox').innerHTML='<img src="'+u+'" alt="Foto">';});}
  else if(id==='k-ph'&&e.target.files[0]){readPhoto(e.target.files[0],u=>{ui.kFoto=u;$('#k-phn').textContent='Foto adjunta ✓';});}
});

load();
if(ui.screen==='chofer'&&ui.view==='parada'&&(!ui.stop||!ord(ui.stop.id)))ui.view='ruta';
render();
})();
</script>
