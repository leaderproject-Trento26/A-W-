<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos Trento</title>
<style>
:root{
  --red:#D71F2B; --red-deep:#A3131D; --red-tint:#FBE9EA; --red-line:#F2C6C9;
  --ink:#231A1B; --muted:#6F6263; --line:#E7DEDE; --ground:#F4EFEF; --surface:#FFFFFF; --sunk:#FAF7F7;
  --ok:#1D8A56; --ok-tint:#E4F4EC; --warn:#B86F00; --warn-tint:#FCF1DC; --info:#2B5DA8; --info-tint:#E6EEF9;
  --violet:#6B45B8; --violet-tint:#EFE9FA;
  --shadow:0 18px 40px -20px rgba(90,20,25,.35);
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
    --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
    --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
    --violet:#B69CF0; --violet-tint:#2A2140;
    --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --red:#E8434D; --red-deep:#FF7A82; --red-tint:#3A1C1F; --red-line:#5C2A2F;
  --ink:#F3ECEC; --muted:#B7A9AA; --line:#3A3031; --ground:#161112; --surface:#221B1C; --sunk:#1B1516;
  --ok:#4CC08A; --ok-tint:#15301F; --warn:#F0A83A; --warn-tint:#33260F; --info:#7FA8EA; --info-tint:#1A2536;
  --violet:#B69CF0; --violet-tint:#2A2140;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font-family:var(--font);font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--red);color:#fff}
.top-in{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-chip{background:#fff;border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center}
.logo-chip img{height:24px;display:block}
.top h1{font-size:16px}
.top .sub{font-size:12px;opacity:.85}
.top .spacer{flex:1}
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.18);border-radius:8px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:#fff;font-weight:700;padding:7px 11px;border-radius:6px;font-size:13px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--red)}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--red);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--red-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--sunk)}
.btn.inv{background:#fff;color:var(--red)}
.btn.inv:hover{background:var(--red-tint)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.okb{background:var(--ok)}
.btn.danger{background:none;color:var(--red);box-shadow:inset 0 0 0 1px var(--red-line)}
.btn.armed{background:var(--red);color:#fff;box-shadow:none}
.conn{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.18)}

/* filtros */
.bar{max-width:1440px;margin:0 auto;padding:14px 16px 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp,.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
.bar .inp{flex:1 1 220px}
.bar .sel{flex:0 1 auto;max-width:190px}
.count{font-size:12px;color:var(--muted);margin-left:auto}
main{max-width:1440px;margin:0 auto;padding:10px 16px 32px}
.foot-bar{max-width:1440px;margin:0 auto;padding:0 16px 32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}

/* tablero */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr)) minmax(160px,190px);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:180px}
.col.over{outline:2px dashed var(--red);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.col-h .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.done-col{background:var(--ok-tint);border-style:dashed;min-height:180px}
.done-drop{align-items:flex-start;gap:10px;font-size:13px;color:var(--ink)}
.done-drop p{margin:0}
.col-add{border:0;background:none;color:var(--muted);text-align:left;padding:8px 12px;font-size:13px;border-top:1px solid var(--line)}
.col-add:hover{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%;position:relative}
.card:hover{border-color:var(--red-line);box-shadow:var(--shadow)}
.card.blk{border-left:3px solid var(--red)}
.card.drag{opacity:.4}
.card .k{font-size:11px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .t{font-weight:700;font-size:13px;line-height:1.3}
.card .meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.card .foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.card .foot .sp{flex:1}
.mini{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;background:var(--ok)}
.av{width:22px;height:22px;border-radius:50%;background:var(--red-tint);color:var(--red);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.p-bad{background:var(--red-tint);color:var(--red)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-info{background:var(--info-tint);color:var(--info)}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-vio{background:var(--violet-tint);color:var(--violet)}
.p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ty{font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:4px}

/* lista */
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
th[data-sort]{cursor:pointer;user-select:none}
td.tt{white-space:normal;min-width:240px;font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--sunk)}
.late{color:var(--red);font-weight:700}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-cell .mini{flex:1;height:6px}
.bar-cell span{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:34px;text-align:right}

/* vista ejecutiva */
.exec{display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--red)}
.kpi.warn b{color:var(--warn)}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--red-line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:14px}
.panel .hint{font-size:12px;color:var(--muted)}
.panel .tbl-wrap{border:0;border-radius:0}
.dec{display:flex;flex-direction:column;gap:0}
.dec-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.dec-row:first-child{border-top:0}
.dec-row .info{flex:1 1 240px;min-width:0;cursor:pointer}
.dec-row .info b{display:block;font-size:13px}
.dec-row .info small{color:var(--muted);font-size:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* configuración */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.cfg textarea{min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}

/* ficha */
.scrim{position:fixed;inset:0;background:rgba(20,10,10,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dr-h .k{font-weight:700;color:var(--muted);font-size:13px}
.dr-h .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted);padding:4px 8px}
.dr-b{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:720px){.dr-b{grid-template-columns:minmax(0,1fr)}}
.dr-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dr-f .sp{flex:1}
.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.f .inp,.f .sel,.f textarea{font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;width:100%}
textarea.inp{resize:vertical;min-height:64px;line-height:1.4}
.title-inp{font-size:18px!important;font-weight:700!important;border-color:transparent!important;padding:6px 8px!important;background:var(--sunk)!important}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{font-size:12px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.ac{display:flex;flex-direction:column;gap:2px}
.ac-row{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.ac-row input[type=checkbox]{accent-color:var(--red);width:17px;height:17px;flex:0 0 auto}
.ac-row input[type=text]{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:none;padding:4px 2px;color:var(--ink)}
.ac-row input[type=text]:focus{border-bottom-color:var(--line);outline:none}
.ac-row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.ac-row .del{border:0;background:none;color:var(--muted);padding:2px 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
.chk input{accent-color:var(--red);width:17px;height:17px}
.blkbox{background:var(--red-tint);border:1px solid var(--red-line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{font-size:13px;color:var(--ink);font-weight:400;text-transform:none;letter-spacing:0;border-left:2px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.log li.c{border-left-color:var(--red)}
.log time{display:block;font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.kids{display:flex;flex-direction:column;gap:4px}
.kids button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;text-align:left;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.kids button:hover{border-color:var(--red-line)}
.kids .kk{color:var(--muted);font-weight:700;font-size:11px}
.kids .kt{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:700;z-index:40;font-size:13px;max-width:calc(100% - 32px)}
.ro-note{background:var(--info-tint);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;max-width:1440px;margin:10px auto 0}
@media (max-width:600px){
  .top h1{font-size:14px}.top .sub{display:none}
  .bar .sel{flex:1 1 45%;max-width:none}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="logo-chip"><img src="logo-trento.jpg" alt="Trento"></span>
    <div><h1>Proyectos y requerimientos · Trento</h1><div class="sub">Gestión de proyectos de todas las áreas</div></div>
    <span class="conn" id="conn">Conectando…</span>
    <div class="spacer"></div>
    <div class="tabs" role="group" aria-label="Vista">
      <button type="button" data-view="exec">Dirección</button>
      <button type="button" data-view="board">Tablero</button>
      <button type="button" data-view="list">Lista</button>
      <button type="button" data-view="done">Hecho</button>
      <button type="button" data-view="cfg">Configuración</button>
    </div>
    <button type="button" class="btn inv" data-a="new" id="btnNew">+ Nuevo</button>
  </div>
</header>

<div id="roNote" class="ro-note" hidden>Estás viendo en modo lectura: podés consultar todo, pero no crear ni modificar.</div>

<div class="bar" id="filters">
  <input class="inp" id="q" type="search" placeholder="Buscar por ID, título, descripción o etiqueta…">
  <select class="sel" id="fArea"></select>
  <select class="sel" id="fProy"></select>
  <select class="sel" id="fTipo"></select>
  <select class="sel" id="fPri"></select>
  <select class="sel" id="fResp"></select>
  <select class="sel" id="fAlert"></select>
  <button type="button" class="btn ghost sm" data-a="clearF">Limpiar filtros</button>
  <span class="count" id="count"></span>
</div>

<main id="main"></main>

<div class="foot-bar" id="footBar">
  <span id="modeTxt"></span>
  <button type="button" class="btn ghost sm" data-a="expCsv">Exportar a Excel (CSV)</button>
  <button type="button" class="btn ghost sm" data-a="expJson">Exportar copia (JSON)</button>
  <label class="btn ghost sm" style="cursor:pointer" id="impLbl">Importar copia<input type="file" id="imp" accept=".json,application/json" hidden></label>
</div>

<div id="dr" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ================= Catálogos fijos ================= */
const ESTADOS=[
  {v:'pendiente',t:'Pendiente por hacer',c:'var(--muted)'},
  {v:'analisis',t:'En análisis',c:'var(--violet)'},
  {v:'aprobacion',t:'Esperando aprobación',c:'var(--warn)'},
  {v:'planificado',t:'Planificado',c:'var(--info)'},
  {v:'curso',t:'En curso',c:'var(--red)'},
  {v:'hecho',t:'Hecho',c:'var(--ok)'}
];
const BOARD=ESTADOS.filter(e=>e.v!=='hecho');
const OLD_EST={nuevo:'pendiente',revision:'curso',cancelado:'hecho'};
const TIPOS=[
  {v:'proyecto',t:'Proyecto',p:'p-vio'},
  {v:'requerimiento',t:'Requerimiento',p:'p-info'},
  {v:'tarea',t:'Tarea',p:'p-mute'},
  {v:'mejora',t:'Mejora',p:'p-ok'},
  {v:'incidente',t:'Incidente',p:'p-bad'}
];
const PRIOS=[{v:'critica',t:'Crítica',p:'p-bad'},{v:'alta',t:'Alta',p:'p-warn'},{v:'media',t:'Media',p:'p-info'},{v:'baja',t:'Baja',p:'p-mute'}];
const IMPACTOS=['Alto','Medio','Bajo'];
const ESFUERZOS=[{v:'',t:'—'},{v:'S',t:'S · días'},{v:'M',t:'M · semanas'},{v:'L',t:'L · 1 a 3 meses'},{v:'XL',t:'XL · más de 3 meses'}];
const APROBS=[{v:'no',t:'No requiere',p:'p-mute'},{v:'pendiente',t:'Pendiente',p:'p-warn'},{v:'aprobado',t:'Aprobado',p:'p-ok'},{v:'rechazado',t:'Rechazado',p:'p-bad'}];
const NIVELES=['Gerencia del área','Dirección General (CEO)'];

/* Configuración editable (valores iniciales) */
const DEF_CFG={
  areas:['Dirección General','Proyectos (PMO)','Comercial y Ventas','Logística y Distribución','Depósito','Compras','Administración y Finanzas','Recursos Humanos','Sistemas / IT','Marketing','Atención al cliente','Calidad','Legal'],
  personas:[
    {n:'Milena Rozo',cargo:'Líder de proyecto',area:'Proyectos (PMO)'},
    {n:'CEO',cargo:'Director General',area:'Dirección General'},
    {n:'Gerente Comercial',cargo:'Gerente',area:'Comercial y Ventas'},
    {n:'Gerente de Logística',cargo:'Gerente',area:'Logística y Distribución'},
    {n:'Jefe de Depósito',cargo:'Jefe',area:'Depósito'},
    {n:'Gerente de Administración y Finanzas',cargo:'Gerente',area:'Administración y Finanzas'},
    {n:'Gerente de RRHH',cargo:'Gerente',area:'Recursos Humanos'},
    {n:'Responsable de Sistemas',cargo:'Responsable',area:'Sistemas / IT'}
  ]
};

/* ================= Ejemplos (solo para el modo local) ================= */
/*SEED-START*/
function seedItems(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  const base={tipo:'requerimiento',estado:'pendiente',prioridad:'media',impacto:'Medio',esfuerzo:'',area:'',areasInv:[],padre:'',solicitante:'',responsable:'',sponsor:'',aprob:'no',aprobNivel:'Gerencia del área',aprobPor:'',aprobFecha:'',inicio:'',vence:'',avance:0,bloqueado:false,bloqueo:'',beneficio:'',costo:'',riesgos:'',desc:'',ac:[],etiquetas:['ejemplo']};
  const L=[
    {titulo:'App Trento Entregas: coordinación de entregas de punta a punta',tipo:'proyecto',estado:'curso',prioridad:'alta',impacto:'Alto',esfuerzo:'XL',area:'Logística y Distribución',areasInv:['Sistemas / IT','Atención al cliente','Comercial y Ventas'],solicitante:'Gerente de Logística',responsable:'Milena Rozo',sponsor:'CEO',aprob:'aprobado',aprobNivel:'Dirección General (CEO)',aprobPor:'CEO',aprobFecha:d(-30),inicio:d(-30),vence:d(75),

/* Avance: proyecto = promedio de sus hijos; con checklist = % tildado; si no, el manual */
function av(x,depth=0){
  if(x.estado==='hecho')return 100;
  const k=depth<3?kidsOf(x.id).filter(c=>!rej(c)):[];
  if(k.length)return Math.round(k.reduce((s,c)=>s+av(c,depth+1),0)/k.length);
  if(x.ac&&x.ac.length)return Math.round(x.ac.filter(a=>a.ok).length/x.ac.length*100);
  return +x.avance||0;
}
const avSrc=x=>kidsOf(x.id).length?'calculado de sus '+kidsOf(x.id).length+' ítems':(x.ac&&x.ac.length?'calculado de los entregables':'manual');

async function putItem(x){
  x=JSON.parse(JSON.stringify(x));if(x.log.length>120)x.log=x.log.slice(-120);
  if(x.estado==='hecho'){if(!x.cerrado)x.cerrado=today()}else x.cerrado='';
  const i=S.items.findIndex(o=>o.id===x.id);if(i>=0)S.items[i]=x;else S.items.push(x);
  if(S.mode==='shared'){try{await DB.doc('items/'+x.id).set(x)}catch(e){writeFail(e)}}else saveLocal();
}
async function delItem(id){

function writeFail(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){S.canWrite=false;applyPerms();toast('No tenés permiso para modificar. Pedile acceso a quien administra el tablero.')}
  else if(c==='quota_exceeded')toast('Se llegó al máximo de registros. Borrá ítems viejos ya hechos para seguir cargando.');
  else toast('No se pudo guardar. Revisá la conexión e intentá de nuevo.');
}
/* Número correlativo TRE-### sin choques entre usuarios */
async function nextId(){
  const maxLocal=S.items.reduce((m,x)=>Math.max(m,+(x.id||'').replace(/\D/g,'')||0),0);
  const fmt=n=>'TRE-'+String(n).padStart(3,'0');
  if(S.mode!=='shared')return fmt(maxLocal+1);
  const ref=DB.doc('meta/seq'),holder='h'+Math.random().toString(36).slice(2);
  for(let t=0;t<12;t++){
    try{
      const r=await ref.acquire({holder,ttlMs:5000});
      if(r.acquired){const s=await ref.get();const n=Math.max(maxLocal,(s.exists&&+s.data().n)||0)+1;await ref.set({n});return fmt(n)}
    }catch(e){break}
    await new Promise(r=>setTimeout(r,250+Math.random()*400));
  }
  return fmt(maxLocal+1);
}
async function startShared(db){
  DB=db;S.mode='shared';
  $('#conn').textContent='Sincronizando…';
  let gotItems=false,gotCfg=false;
  db.collection('items').onSnapshot(snap=>{
    S.items=snap.docs.map(d=>normItem(Object.assign({},d.data())));gotItems=true;
    if(gotCfg)refreshAll();
  },()=>{$('#conn').textContent='Sin conexión'});
  db.doc('config/app').onSnapshot(snap=>{
    if(snap.exists){const c=snap.data();S.cfg={areas:(c.areas||DEF_CFG.areas).slice(),personas:(c.personas||DEF_CFG.personas).map(p=>Object.assign({},p))}}
    gotCfg=true;if(gotItems)refreshAll();
  },()=>{});
}
async function boot(){
  const cl=window.claude;

  const [db,user,dl]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('downloads')].map(p=>p.catch(()=>null)));
  USER=user;DL=dl;
  if(user){
    try{S.me=await user.id()}catch(e){}

function filtered(){

    if(a&&x.area!==a&&!x.areasInv.includes(a))return false;

    if(t&&x.tipo!==t)return false;

const FIELDS=['titulo','desc','beneficio','impacto','costo','riesgos','estado','tipo','prioridad','area','padre','solicitante','responsable','sponsor','inicio','vence','esfuerzo','aprob','aprobNivel','bloqueo'];
function readDraft(){

const LBL={titulo:'Título',estado:'Estado',tipo:'Tipo',prioridad:'Prioridad',area:'Área',padre:'Proyecto',responsable:'Responsable',sponsor:'Sponsor',vence:'Fecha comprometida',aprob:'Aprobación',bloqueado:'Bloqueado',costo:'Costo'};
function nice(f,v){
  if(f==='estado')return find(ESTADOS,v).t;if(f==='tipo')return find(TIPOS,v).t;if(f==='prioridad')return find(PRIOS,v).t;
  if(f==='aprob')return find(APROBS,v).t;if(f==='bloqueado')return v?'sí':'no';if(f==='vence')return fmtD(v);if(f==='costo')return money(v);return v||'—';
}
const who=()=>({by:S.me||'',who:S.meName||(S.mode==='local'?'Yo':'Alguien')});
const whoName=()=>S.meName||'';
async function saveItem(){
  readDraft();const x=UI.draft;
  if(!x.titulo){toast('Escribí un título para poder guardarlo');$('#e-titulo').focus();return}
  if(x.estado==='aprobacion'&&x.aprob==='no')x.aprob='pendiente';
  const now=new Date().toISOString();
  const btn=$('[data-a="saveItem"]');if(btn)btn.disabled=true;
  if(!UI.open){
    x.id=await nextId();x.creado=now;x.act=now;x.creadoPor=S.me||'';x.log=[Object.assign({at:now,txt:'Creó el ítem'},who())];
    await putItem(x);toast(x.id+' creado');
  }else{
    const old=byId(UI.open)||{};
    if(old.aprob!==x.aprob&&(x.aprob==='aprobado'||x.aprob==='rechazado')){x.aprobFecha=today();x.aprobPor=x.aprobPor&&old.aprob===x.aprob?x.aprobPor:(whoName()||x.aprobPor)}
    const ch=Object.keys(LBL).filter(f=>JSON.stringify(old[f])!==JSON.stringify(x[f])).map(f=>LBL[f]+': '+nice(f,old[f])+' → '+nice(f,x[f]));
    x.log=(old.log||x.log).slice();
    if(ch.length)x.log.push(Object.assign({at:now,txt:ch.join(' · ')},who()));
    x.act=now;await putItem(x);toast(x.id+' guardado');
  }
  closeDr();refreshAll();
}
function closeDr(){UI.open=null;UI.draft=null;UI.dirty=false;$('#dr').hidden=true;$('#dr').innerHTML=''}
async function quickUpdate(id,changes,txt){

  Object.assign(x,changes);const now=new Date().toISOString();x.act=now;x.log.push(Object.assign({at:now,txt},who()));

/* ================= Exportar / importar ================= */
async function saveFile(name,text,type){
  if(DL){try{await DL.save({filename:name,data:new Blob([text],{type})});toast('Archivo listo');return}catch(e){if(e&&e.code==='declined')return;toast('No se pudo descargar el archivo');return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}catch(e){toast('No se pudo descargar el archivo')}
}

async function importData(d){
  if(!d||!Array.isArray(d.items))throw 0;
  if(d.cfg&&S.canAdmin)await putCfg({areas:d.cfg.areas||S.cfg.areas,personas:d.cfg.personas||S.cfg.personas});
  for(const it of d.items){if(it&&it.id&&/^[A-Za-z0-9_\-]+$/.test(it.id))await putItem(normItem(it))}
  refreshAll();toast('Se importaron '+d.items.length+' ítems');
}

function armed(btn){
  if(btn.dataset.armed)return true;
  document.querySelectorAll('[data-armed]').forEach(b=>{b.textContent=b.dataset.orig;delete b.dataset.armed;b.classList.remove('armed')});
  btn.dataset.orig=btn.textContent;btn.dataset.armed='1';btn.textContent=btn.dataset.confirm;btn.classList.add('armed');
  setTimeout(()=>{if(btn.dataset.armed){btn.textContent=btn.dataset.orig;delete btn.dataset.armed;btn.classList.remove('armed')}},4000);
  return false;
}
document.addEventListener('click',async e=>{
  const v=e.target.closest('[data-view]');if(v){if(UI.view==='done'||v.dataset.view==='done')$('#fAlert').value='';UI.view=v.dataset.view;try{localStorage.setItem(LS+'-view',UI.view)}catch(_){}render();return}
  const th=e.target.closest('[data-sort]');if(th){const k=th.dataset.sort;UI.sort=UI.sort.k===k?{k,d:-UI.sort.d}:{k,d:1};render();return}
  const al=e.target.closest('[data-alert]');if(al){$('#fAlert').value=al.dataset.alert;UI.view='list';render();return}
  const ch=e.target.closest('[data-chip]');
  if(ch){if(!S.canWrite)return;readDraft();UI.dirty=true;const arr=UI.draft[ch.dataset.chip],val=ch.dataset.v,i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);drawDrawer();return}
  const go=e.target.closest('[data-goto]');if(go){openItem(go.dataset.goto);return}
  const del=e.target.closest('[data-acdel]');if(del){readDraft();UI.dirty=true;UI.draft.ac.splice(+del.dataset.acdel,1);drawDrawer();return}
  const a=e.target.closest('[data-a]');
  const op=e.target.closest('[data-open]');
  if(op&&!e.target.closest('.drawer')&&!(a&&op.contains(a)&&a!==op)){openItem(op.dataset.open);return}
  if(!a)return;
  if(a.dataset.confirm&&!armed(a))return;
  switch(a.dataset.a){
    case 'new':openItem(null,a.dataset.st);break;
    case 'close':closeDr();break;
    case 'saveItem':saveItem();break;
    case 'comment':{const t=$('#e-com').value.trim();if(!t)return;readDraft();const now=new Date().toISOString();
      const cur=JSON.parse(JSON.stringify(byId(UI.open)));cur.log.push(Object.assign({at:now,txt:t,c:1},who()));cur.act=now;
      UI.draft.log=cur.log.slice();await putItem(cur);drawDrawer();break}
    case 'del':{const id=UI.open;await delItem(id);for(const k of kidsOf(id)){k.padre='';await putItem(k)}toast(id+' eliminado');closeDr();refreshAll();break}
    case 'dup':{readDraft();const c=JSON.parse(JSON.stringify(UI.draft));c.titulo+=' (copia)';c.log=[];c.ac.forEach(q=>q.ok=false);c.aprob=c.aprob==='no'?'no':'pendiente';c.aprobPor='';c.aprobFecha='';UI.open=null;c.id='';UI.draft=c;UI.dirty=true;drawDrawer();break}
    case 'approve':{const x=byId(a.dataset.id);await quickUpdate(a.dataset.id,{aprob:'aprobado',aprobPor:whoName(),aprobFecha:today(),estado:x.estado==='aprobacion'?'planificado':x.estado},'Aprobó ('+x.aprobNivel+')');toast(a.dataset.id+' aprobado');break}
    case 'reject':await quickUpdate(a.dataset.id,{aprob:'rechazado',aprobPor:whoName(),aprobFecha:today(),estado:'hecho'},'Rechazó el pedido');toast(a.dataset.id+' rechazado');break;
    case 'clearF':['#q','#fArea','#fProy','#fTipo','#fPri','#fResp','#fAlert'].forEach(s=>$(s).value='');render();break;
    case 'expJson':saveFile('trento-proyectos-'+today()+'.json',JSON.stringify({items:S.items,cfg:S.cfg},null,2),'application/json');break;
    case 'expCsv':saveFile('trento-proyectos-'+today()+'.csv',csv(),'text/csv');break;
    case 'saveCfg':{
      const areas=[...new Set($('#cfgAreas').value.split('\n').map(s=>s.trim()).filter(Boolean))];
      const pers=$('#cfgPers').value.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p[0]).map(p=>({n:p[0],cargo:p[1]||'',area:p[2]||''}));
      if(!areas.length){toast('Cargá al menos un área');return}
      if(await putCfg({areas,personas:pers})){toast('Configuración guardada');refreshAll()}break}
    case 'delSamples':{const ids=S.items.filter(x=>x.etiquetas.includes('ejemplo')).map(x=>x.id);for(const id of ids)await delItem(id);toast(ids.length+' ejemplos borrados');refreshAll();break}
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-acok]')){readDraft();UI.dirty=true;UI.draft.ac[+e.target.dataset.acok].ok=e.target.checked;drawDrawer();return}
  if(e.target.id==='e-bloqueado'||e.target.id==='e-aprob'||e.target.id==='e-padre'||e.target.id==='e-avance'){readDraft();UI.dirty=true;drawDrawer();return}
  if(e.target.closest('.drawer')){UI.dirty=true;return}
  if(e.target.closest('#filters'))render();
});
document.addEventListener('input',e=>{if(e.target.id==='q')render();else if(e.target.closest('.drawer'))UI.dirty=true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.draft)closeDr();
  if(e.key==='Enter'&&e.target.id==='e-acnew'){e.preventDefault();const t=e.target.value.trim();if(!t)return;readDraft();UI.dirty=true;UI.draft.ac.push({t,ok:false});drawDrawer();const n=$('#e-acnew');if(n)n.focus()}
  if(e.key==='Enter'&&e.target.id==='e-com'){e.preventDefault();$('[data-a="comment"]').click()}
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{await importData(JSON.parse(r.result))}catch(_){toast('Ese archivo no es una copia válida de este tablero')}e.target.value=''};
  r.readAsText(f);
});
/* arrastrar tarjetas entre columnas */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c||!S.canWrite)return;dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)c.classList.remove('drag');document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',async e=>{
  const col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();
  const id=dragId,x=byId(id),st=col.dataset.col;dragId=null;
  if(x&&x.estado!==st){const ch={estado:st};if(st==='aprobacion'&&x.aprob!=='pendiente')ch.aprob='pendiente';await quickUpdate(id,ch,'Estado: '+find(ESTADOS,x.estado).t+' → '+find(ESTADOS,st).t);toast(id+' → '+find(ESTADOS,st).t)}
  else render();
});

render();boot();
</script>
</body>
</html>
